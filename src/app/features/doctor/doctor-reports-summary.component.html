<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-5">
    <div
        class="bg-[var(--panel)] border border-[var(--border)] rounded-2xl p-5 shadow-xl relative overflow-hidden group hover:border-[var(--accent)]/40 transition-all flex flex-col justify-between">
        <div>
            <div class="flex items-center justify-between">
                <span class="text-xs font-semibold text-[var(--muted)]">Total Appointments</span>
                <div
                    class="w-10 h-10 rounded-xl bg-[#10b981]/15 border border-[#10b981]/30 flex items-center justify-center text-[#10b981]">
                    <i class="fa-solid fa-calendar-check text-sm"></i>
                </div>
            </div>
            <div class="mt-2 text-2xl sm:text-3xl font-black text-[var(--text)] tracking-tight">
                {{ appointmentCount ?? '—' }}
            </div>
        </div>
    </div>

    <div
        class="bg-[var(--panel)] border border-[var(--border)] rounded-2xl p-5 shadow-xl relative overflow-hidden group hover:border-[var(--accent)]/40 transition-all flex flex-col justify-between">
        <div>
            <div class="flex items-center justify-between">
                <span class="text-xs font-semibold text-[var(--muted)]">Total Revenue</span>
                <div
                    class="w-10 h-10 rounded-xl bg-[#10b981]/15 border border-[#10b981]/30 flex items-center justify-center text-[#10b981]">
                    <i class="fa-solid fa-sack-dollar text-sm"></i>
                </div>
            </div>
            <div class="mt-2 text-2xl sm:text-3xl font-black text-[var(--text)] tracking-tight">
                Not available
            </div>
        </div>
    </div>

    <div
        class="bg-[var(--panel)] border border-[var(--border)] rounded-2xl p-5 shadow-xl relative overflow-hidden group hover:border-[var(--accent)]/40 transition-all flex flex-col justify-between">
        <div>
            <div class="flex items-center justify-between">
                <span class="text-xs font-semibold text-[var(--muted)]">Average Rating</span>
                <div
                    class="w-10 h-10 rounded-xl bg-[#f59e0b]/15 border border-[#f59e0b]/30 flex items-center justify-center text-[#f59e0b]">
                    <i class="fa-solid fa-star text-sm"></i>
                </div>
            </div>
            <div
                class="mt-2 text-2xl sm:text-3xl font-black text-[var(--text)] tracking-tight flex items-center gap-1.5">
                <span>{{ doctorRating ?? '—' }}</span>
                <i class="fa-solid fa-star text-[#f59e0b] text-xl"></i>
            </div>
        </div>
    </div>

    <div
        class="bg-[var(--panel)] border border-[var(--border)] rounded-2xl p-5 shadow-xl relative overflow-hidden group hover:border-[var(--accent)]/40 transition-all flex flex-col justify-between">
        <div>
            <div class="flex items-center justify-between">
                <span class="text-xs font-semibold text-[var(--muted)]">Consultation Rate</span>
                <div
                    class="w-10 h-10 rounded-xl bg-[var(--accent)]/15 border border-[var(--accent)]/30 flex items-center justify-center text-[var(--accent)]">
                    <i class="fa-solid fa-users text-sm"></i>
                </div>
            </div>
            <div class="mt-2 text-2xl sm:text-3xl font-black text-[var(--text)] tracking-tight">
                {{ retention?.retentionRate ?? '—' }}{{ retention?.retentionRate != null ? '%' : '' }}
            </div>
        </div>
    </div>
</div>
