<div class="grid grid-cols-2 lg:grid-cols-4 gap-2.5 sm:gap-5">
    <div
        class="bg-[var(--panel)] border border-[var(--border)] rounded-xl sm:rounded-2xl p-3 sm:p-5 shadow-xl relative overflow-hidden group hover:border-[var(--accent)]/40 transition-all flex flex-col justify-between min-w-0">
        <div>
            <div class="flex items-center justify-between">
                <span class="text-[11px] sm:text-xs font-semibold text-[var(--muted)] leading-tight pr-1">Total Appointments</span>
                <div
                    class="w-8 h-8 sm:w-10 sm:h-10 rounded-lg sm:rounded-xl bg-[#10b981]/15 border border-[#10b981]/30 flex items-center justify-center text-[#10b981] shrink-0">
                    <i class="fa-solid fa-calendar-check text-sm"></i>
                </div>
            </div>
            <div class="mt-2 text-lg sm:text-3xl font-black text-[var(--text)] tracking-tight leading-tight">
                {{ appointmentCount ?? '—' }}
            </div>
        </div>
    </div>

    <div
        class="bg-[var(--panel)] border border-[var(--border)] rounded-xl sm:rounded-2xl p-3 sm:p-5 shadow-xl relative overflow-hidden group hover:border-[var(--accent)]/40 transition-all flex flex-col justify-between min-w-0">
        <div>
            <div class="flex items-center justify-between">
                <span class="text-[11px] sm:text-xs font-semibold text-[var(--muted)] leading-tight pr-1">Total Revenue</span>
                <div
                    class="w-8 h-8 sm:w-10 sm:h-10 rounded-lg sm:rounded-xl bg-[#10b981]/15 border border-[#10b981]/30 flex items-center justify-center text-[#10b981] shrink-0">
                    <i class="fa-solid fa-sack-dollar text-sm"></i>
                </div>
            </div>
            <div class="mt-2 text-lg sm:text-3xl font-black text-[var(--text)] tracking-tight leading-tight">
                Not available
            </div>
        </div>
    </div>

    <div
        class="bg-[var(--panel)] border border-[var(--border)] rounded-xl sm:rounded-2xl p-3 sm:p-5 shadow-xl relative overflow-hidden group hover:border-[var(--accent)]/40 transition-all flex flex-col justify-between min-w-0">
        <div>
            <div class="flex items-center justify-between">
                <span class="text-[11px] sm:text-xs font-semibold text-[var(--muted)] leading-tight pr-1">Average Rating</span>
                <div
                    class="w-8 h-8 sm:w-10 sm:h-10 rounded-lg sm:rounded-xl bg-[#f59e0b]/15 border border-[#f59e0b]/30 flex items-center justify-center text-[#f59e0b] shrink-0">
                    <i class="fa-solid fa-star text-sm"></i>
                </div>
            </div>
            <div
                class="mt-2 text-lg sm:text-3xl font-black text-[var(--text)] tracking-tight leading-tight flex items-center gap-1.5">
                <span>{{ doctorRating ?? '—' }}</span>
                <i class="fa-solid fa-star text-[#f59e0b] text-xl"></i>
            </div>
        </div>
    </div>

    <div
        class="bg-[var(--panel)] border border-[var(--border)] rounded-xl sm:rounded-2xl p-3 sm:p-5 shadow-xl relative overflow-hidden group hover:border-[var(--accent)]/40 transition-all flex flex-col justify-between min-w-0">
        <div>
            <div class="flex items-center justify-between">
                <span class="text-[11px] sm:text-xs font-semibold text-[var(--muted)] leading-tight pr-1">Consultation Rate</span>
                <div
                    class="w-8 h-8 sm:w-10 sm:h-10 rounded-lg sm:rounded-xl bg-[var(--accent)]/15 border border-[var(--accent)]/30 flex items-center justify-center text-[var(--accent)] shrink-0">
                    <i class="fa-solid fa-users text-sm"></i>
                </div>
            </div>
            <div class="mt-2 text-lg sm:text-3xl font-black text-[var(--text)] tracking-tight leading-tight">
                {{ retention?.retentionRate ?? '—' }}{{ retention?.retentionRate != null ? '%' : '' }}
            </div>
        </div>
    </div>
</div>
