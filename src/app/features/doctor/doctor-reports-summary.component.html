<div class="grid grid-cols-2 lg:grid-cols-4 gap-2.5 sm:gap-5">
    <app-stat-card label="Total Appointments" icon="fa-solid fa-calendar-check" tone="success"
        [value]="appointmentCount"></app-stat-card>
    <app-stat-card label="Total Revenue" icon="fa-solid fa-sack-dollar" tone="success"
        value="Not available"></app-stat-card>
    <app-stat-card label="Average Rating" icon="fa-solid fa-star" tone="warning"
        [value]="doctorRating"></app-stat-card>
    <app-stat-card label="Consultation Rate" icon="fa-solid fa-users" tone="info"
        [value]="retentionLabel"></app-stat-card>
</div>
