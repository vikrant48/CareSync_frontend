<app-doctor-layout>
    <div class="max-w-7xl mx-auto p-4 sm:p-6 space-y-8">
        <!-- Header -->
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 sm:gap-4">
            <div>
                <h2 class="font-display text-xl sm:text-2xl font-bold text-gray-900 dark:text-white tracking-tight">
                    Appointments</h2>
                <p class="text-gray-500 dark:text-gray-400 text-xs sm:text-sm mt-0.5">Manage your patient appointments
                    and schedules</p>
            </div>
        </div>

        <app-filter-bar [(expanded)]="isFilterExpanded" [activeCount]="appointmentFilterActiveCount"
            gridClass="grid grid-cols-1 md:grid-cols-3 gap-3 sm:gap-5" (clear)="clearAppointmentFilters()">
            <div class="space-y-0.5">
                <app-select-dropdown label="Status" [(ngModel)]="statusFilter" [options]="statusOptions"
                    (ngModelChange)="onFilterChange()" placeholder="All Statuses">
                </app-select-dropdown>
            </div>

            <div class="space-y-0.5">
                <label class="filter-label">Search</label>
                <div class="relative w-full">
                    <i
                        class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-xs sm:text-sm pointer-events-none z-10"></i>
                    <input type="text" class="filter-input-search" [(ngModel)]="searchTerm" (input)="onFilterChange()"
                        placeholder="Search patient name or ID..." />
                </div>
            </div>

            <div class="space-y-0.5">
                <label class="filter-label">Time Range</label>
                <div class="filter-time-range-container gap-1">
                    <button type="button" class="filter-time-range-btn" [class.is-active]="range==='TODAY'"
                        (click)="setRange('TODAY')">Today</button>
                    <button type="button" class="filter-time-range-btn" [class.is-active]="range==='UPCOMING'"
                        (click)="setRange('UPCOMING')">Upcoming</button>
                    <button type="button" class="filter-time-range-btn" [class.is-active]="range==='PAST'"
                        (click)="setRange('PAST')">Past</button>
                    <button type="button" class="filter-time-range-btn" [class.is-active]="range==='ALL'"
                        (click)="setRange('ALL')">All</button>
                </div>
            </div>
        </app-filter-bar>

        <app-skeleton *ngIf="loading" variant="card" [count]="6"
            wrapperClass="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></app-skeleton>

        <app-empty-state *ngIf="!loading && filteredAppointments().length === 0" icon="fa-solid fa-calendar-xmark"
            title="No appointments found"
            message="Try adjusting your filters or search terms to find what you're looking for." [hasAction]="true">
            <button type="button" class="btn-secondary"
                (click)="statusFilter='ALL'; range='ALL'; searchTerm=''; refresh()">Clear Filters</button>
        </app-empty-state>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 animate-in fade-in slide-in-from-bottom-4"
            *ngIf="!loading && filteredAppointments().length > 0">
            <doctor-appointment-card *ngFor="let a of filteredAppointments()" class="h-full" [appointment]="a"
                [showStatusSelect]="true" (viewPatient)="openDetails($event)" (openHistoryForm)="openDetails($event)"
                (schedule)="changeStatus($event, 'SCHEDULED')" (confirm)="changeStatus($event, 'CONFIRMED')"
                (start)="startConsultation($event)" (complete)="changeStatus($event, 'COMPLETED')"
                (cancel)="changeStatus($event, 'CANCELLED')" (joinVideo)="joinConsultation($event)"
                (statusChange)="changeStatus($event.appointment, $event.status)"
                (openChat)="openChat($event)"></doctor-appointment-card>
        </div>

        <!-- Fixed Bottom Pagination Bar -->
        <div *ngIf="!loading && totalAppointmentsCount > 0"
            class="fixed left-0 md:left-64 right-0 z-40 bg-white/95 dark:bg-gray-900/95 backdrop-blur-md border-t border-gray-200 dark:border-gray-800 shadow-2xl px-4 sm:px-8 py-2 flex items-center justify-between transition-all fixed-above-mobile-nav safe-bottom">

            <div class="flex items-center gap-3 text-xs sm:text-sm text-gray-600 dark:text-gray-400">
                <span class="font-medium">
                    Showing <span class="font-bold text-gray-900 dark:text-gray-100">{{ startItemIndex }}–{{
                        endItemIndex }}</span> of <span class="font-bold text-blue-600 dark:text-blue-400">{{
                        totalAppointmentsCount }}</span> appointments
                </span>
                <span class="hidden sm:inline text-gray-300 dark:text-gray-700">|</span>
                <span class="hidden sm:inline font-medium">
                    Page <span class="font-semibold text-gray-900 dark:text-gray-100">{{ page + 1 }}</span> of {{
                    totalPages }}
                </span>
            </div>

            <div class="flex items-center gap-2">
                <button
                    class="px-3 py-1.5 text-xs sm:text-sm font-medium rounded-lg border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-700 disabled:opacity-40 disabled:cursor-not-allowed transition-all flex items-center gap-1 shadow-sm"
                    [disabled]="page === 0" (click)="prevPage()">
                    <i class="fa-solid fa-chevron-left text-[10px]"></i> Prev
                </button>

                <span class="sm:hidden text-xs font-semibold text-gray-700 dark:text-gray-300 px-1">
                    {{ page + 1 }}/{{ totalPages }}
                </span>

                <button
                    class="px-3 py-1.5 text-xs sm:text-sm font-medium rounded-lg border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-700 disabled:opacity-40 disabled:cursor-not-allowed transition-all flex items-center gap-1 shadow-sm"
                    [disabled]="page >= totalPages - 1" (click)="nextPage()">
                    Next <i class="fa-solid fa-chevron-right text-[10px]"></i>
                </button>
            </div>
        </div>

        <!-- Details Modal (Shared) -->
        <app-patient-details-modal [open]="detailsOpen" [patient]="patient" [history]="history" [documents]="documents"
            (close)="closeDetails()" (historyClick)="viewHistoryDetail($event)"></app-patient-details-modal>

        <!-- History Detail Modal (Shared) -->
        <app-medical-history-detail-modal [open]="historyDetailModalOpen" [detail]="selectedHistoryDetail"
            [doctorInfo]="selectedHistoryDoctorInfo" (close)="closeHistoryDetail()"></app-medical-history-detail-modal>

        <!-- Shared Chat Modal -->
        <app-shared-chat-modal [isOpen]="chatOpen" [appointmentId]="chatAppointmentId"
            [participantName]="chatParticipantName" [participantImage]="chatParticipantImage"
            (close)="closeChat()"></app-shared-chat-modal>
    </div>
</app-doctor-layout>
