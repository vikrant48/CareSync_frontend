<app-doctor-layout>
    <div class="max-w-[1400px] mx-auto p-4 sm:p-6 space-y-6 text-white font-sans selection:bg-[#2dd4bf]/30 pb-20">

        <!-- Page Header with Ambient Graphic Wave -->
        <div
            class="relative overflow-hidden rounded-2xl bg-gradient-to-r from-[#0a1e2b] via-[#081724] to-[#0d1724] border border-[#162a3d] p-6 shadow-2xl">
            <!-- Ambient Backdrop Graphic -->
            <div class="absolute -top-12 -right-12 w-64 h-64 bg-[#2dd4bf]/10 rounded-full blur-3xl pointer-events-none">
            </div>

            <div class="relative z-10 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                <div>
                    <h1 class="text-2xl sm:text-3xl font-black text-white tracking-tight">Appointments</h1>
                    <p class="text-xs sm:text-sm text-[#8b9cb0] font-medium mt-1">Manage your patient appointments and
                        schedules</p>
                </div>
            </div>
        </div>

        <!-- Filters Section Container -->
        <app-filter-bar [filters]="appointmentFilterConfigs" [values]="appointmentFilterValues" [theme]="'doctor'"
            (filterChange)="onFilterBarChange($event)">
        </app-filter-bar>

        <!-- Loading Skeleton -->
        <app-skeleton *ngIf="loading" variant="card" [count]="6"
            wrapperClass="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></app-skeleton>

        <!-- Empty State -->
        <app-empty-state *ngIf="!loading && filteredAppointments().length === 0" icon="fa-solid fa-calendar-xmark"
            title="No appointments found"
            message="Try adjusting your filters or search terms to find what you're looking for." [hasAction]="true">
            <button type="button" class="mt-2 text-xs font-bold text-[#2dd4bf] hover:underline px-3 py-1"
                (click)="clearAppointmentFilters()">Clear Filters</button>
        </app-empty-state>

        <!-- Appointment Cards Grid (Preserved Untouched) -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"
            *ngIf="!loading && filteredAppointments().length > 0">
            <app-appointment-card *ngFor="let a of filteredAppointments()" class="h-full" [appointment]="a"
                viewerRole="DOCTOR"></app-appointment-card>
        </div>

        <!-- Fixed Bottom Pagination Bar -->
        <div *ngIf="!loading && (totalAppointmentsCount > 0 || appointments.length > 0)"
            class="fixed left-0 md:left-64 right-0 bottom-0 z-50 bg-[#0f1724]/95 backdrop-blur-md border-t border-[#1a2738] px-4 sm:px-8 py-1.5 flex items-center justify-between shadow-2xl">

            <div class="flex items-center gap-3 text-xs text-[#8b9cb0]">
                <span class="font-medium">
                    Showing <span class="font-bold text-white">{{ startItemIndex }}–{{ endItemIndex }}</span> of <span
                        class="font-bold text-[#2dd4bf]">{{ totalAppointmentsCount }}</span> appointments
                </span>
            </div>

            <div class="flex items-center gap-1">
                <button type="button"
                    class="px-2.5 py-1 text-[11px] font-bold rounded-md border border-[#202f45] bg-[#182333] text-white hover:bg-[#202f45] disabled:opacity-40 disabled:cursor-not-allowed transition-all flex items-center gap-1 cursor-pointer"
                    [disabled]="page === 0" (click)="prevPage()">
                    <i class="fa-solid fa-chevron-left text-[8px]"></i> Prev
                </button>

                <div class="flex items-center gap-1">
                    <button *ngFor="let p of pageNumbers" type="button" (click)="goToPage(p)"
                        [class]="p === page ? 'bg-[#2dd4bf] text-[#071918] font-black' : 'bg-[#182333] border border-[#202f45] text-[#8b9cb0] hover:text-white font-bold'"
                        class="w-6 h-6 text-[11px] rounded-md transition-all flex items-center justify-center cursor-pointer">
                        {{ p + 1 }}
                    </button>
                </div>

                <button type="button"
                    class="px-2.5 py-1 text-[11px] font-bold rounded-md border border-[#202f45] bg-[#182333] text-white hover:bg-[#202f45] disabled:opacity-40 disabled:cursor-not-allowed transition-all flex items-center gap-1 cursor-pointer"
                    [disabled]="page >= totalPages - 1" (click)="nextPage()">
                    Next <i class="fa-solid fa-chevron-right text-[8px]"></i>
                </button>
            </div>
        </div>

        <!-- Details Modal (Shared) -->
        <app-patient-details-modal [open]="detailsOpen" [patient]="patient" [history]="history" [documents]="documents"
            (close)="closeDetails()" (historyClick)="viewHistoryDetail($event)"></app-patient-details-modal>

        <!-- History Detail Modal (Shared) -->
        <app-medical-history-detail-modal [open]="historyDetailModalOpen" [detail]="selectedHistoryDetail"
            [doctorInfo]="selectedHistoryDoctorInfo" (close)="closeHistoryDetail()"></app-medical-history-detail-modal>

        <!-- Pre-Visit Intake AI Summary Modal -->
        <app-intake-summary-modal [isOpen]="intakeModalOpen" [appointmentId]="selectedIntakeAppointmentId"
            [summaryText]="intakeSummaryText" [intakeData]="intakeData"
            (close)="closeIntakeModal()"></app-intake-summary-modal>

        <!-- Ambient AI Scribe & SOAP Report Editor Modal -->
        <app-soap-report-editor [isOpen]="soapModalOpen" [appointmentId]="selectedSoapAppointmentId"
            [soapReport]="soapReportData" (close)="closeSoapModal()"
            (reportSigned)="onSoapReportSigned($event)"></app-soap-report-editor>

        <!-- Shared Chat Modal -->
        <app-shared-chat-modal [isOpen]="chatOpen" [appointmentId]="chatAppointmentId"
            [participantName]="chatParticipantName" [participantImage]="chatParticipantImage"
            (close)="closeChat()"></app-shared-chat-modal>
    </div>
</app-doctor-layout>
