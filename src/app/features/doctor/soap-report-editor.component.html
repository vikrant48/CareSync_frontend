<app-modal-shell [open]="isOpen" title="AI Ambient Scribe & SOAP Report Editor"
    [subtitle]="'Appointment #' + appointmentId + ' • Clinical Medical Documentation'" titleId="soap-editor-title"
    icon="fa-solid fa-file-medical" iconWrapClass="bg-purple-500/15 text-purple-700 dark:text-purple-300"
    maxWidthClass="max-w-4xl" bodyClass="p-4 sm:p-6 space-y-4" footerClass="p-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2"
    [hasFooter]="true" (close)="closeModal()">

    <span *ngIf="soapReport && soapReport.isSigned" modalHeaderExtra
        class="mt-1 inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-700 dark:text-emerald-400 text-[10px] uppercase font-bold border border-emerald-500/40">
        <i class="fa-solid fa-signature"></i> Signed
    </span>

    <div *ngIf="soapReport && !soapReport.isSigned"
        class="bg-[var(--bg)] border border-[var(--border)] rounded-xl p-4 space-y-3">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
            <span class="text-xs font-semibold text-purple-700 dark:text-purple-300 uppercase tracking-wider flex items-center gap-2">
                <i class="fa-solid fa-wand-magic-sparkles"></i> Ambient AI Scribe Assistant
            </span>
            <div class="flex flex-wrap gap-2">
                <button type="button" (click)="showDictation = true" class="btn-secondary min-h-[44px]">
                    <i class="fa-solid fa-microphone"></i><span>Dictate Visit</span>
                </button>
                <button type="button" (click)="generateDraft()" [disabled]="generating"
                    class="btn-primary min-h-[44px] disabled:opacity-50">
                    <i *ngIf="generating" class="fa-solid fa-spinner fa-spin"></i>
                    <span>Generate AI SOAP Draft</span>
                </button>
            </div>
        </div>
        <textarea rows="3" [(ngModel)]="transcriptInput"
            placeholder="Paste or type consultation transcript notes (e.g. 'Patient reports fever of 101F for 2 days...')"
            class="form-input"></textarea>
    </div>

    <div class="bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-500/30 rounded-xl p-3 flex items-start gap-3 text-xs text-amber-900 dark:text-amber-200">
        <i class="fa-solid fa-triangle-exclamation text-amber-600 dark:text-amber-400 text-sm mt-0.5"></i>
        <span>AI Scribe draft requires physician review, editing, and electronic signature before finalization.</span>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="space-y-1.5">
            <label class="text-xs font-bold text-[var(--text)] flex items-center gap-1.5 uppercase">
                <span class="w-2 h-2 rounded-full bg-blue-500"></span> Subjective (Patient History & Symptoms)
            </label>
            <textarea [(ngModel)]="soapReport.subjective" [disabled]="soapReport.isSigned || false" rows="5"
                placeholder="Patient reports symptoms, onset, location, severity..."
                class="form-input disabled:opacity-60"></textarea>
        </div>
        <div class="space-y-1.5">
            <label class="text-xs font-bold text-[var(--text)] flex items-center gap-1.5 uppercase">
                <span class="w-2 h-2 rounded-full bg-emerald-500"></span> Objective (Vitals & Physical Exam)
            </label>
            <textarea [(ngModel)]="soapReport.objective" [disabled]="soapReport.isSigned || false" rows="5"
                placeholder="Vital signs, physical findings, lab results..."
                class="form-input disabled:opacity-60"></textarea>
        </div>
        <div class="space-y-1.5">
            <label class="text-xs font-bold text-[var(--text)] flex items-center gap-1.5 uppercase">
                <span class="w-2 h-2 rounded-full bg-amber-500"></span> Assessment (Diagnosis & Clinical Impression)
            </label>
            <textarea [(ngModel)]="soapReport.assessment" [disabled]="soapReport.isSigned || false" rows="5"
                placeholder="Primary diagnosis, differential diagnoses..."
                class="form-input disabled:opacity-60"></textarea>
        </div>
        <div class="space-y-1.5">
            <label class="text-xs font-bold text-[var(--text)] flex items-center gap-1.5 uppercase">
                <span class="w-2 h-2 rounded-full bg-purple-500"></span> Plan (Prescriptions, Orders & Follow-Up)
            </label>
            <textarea [(ngModel)]="soapReport.plan" [disabled]="soapReport.isSigned || false" rows="5"
                placeholder="Medications, dosage, diagnostic orders, follow-up instructions..."
                class="form-input disabled:opacity-60"></textarea>
        </div>
    </div>

    <div class="rounded-xl border border-emerald-500/25 bg-emerald-500/5 p-4 space-y-3">
        <div>
            <div class="text-xs font-bold uppercase text-emerald-700 dark:text-emerald-300">Prescription draft</div>
            <div class="text-[11px] text-[var(--muted)]">AI-extracted medication details remain editable and are not final until the visit is electronically signed.</div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="space-y-1.5">
                <label class="text-xs font-bold text-[var(--text)]">Medicines</label>
                <textarea [(ngModel)]="soapReport.medicine" [disabled]="soapReport.isSigned || false" rows="3"
                    placeholder="Medication names" class="form-input disabled:opacity-60"></textarea>
            </div>
            <div class="space-y-1.5">
                <label class="text-xs font-bold text-[var(--text)]">Dose, frequency, duration & instructions</label>
                <textarea [(ngModel)]="soapReport.doses" [disabled]="soapReport.isSigned || false" rows="3"
                    placeholder="Review dosage and instructions carefully" class="form-input disabled:opacity-60"></textarea>
            </div>
        </div>
    </div>

    <div modalFooter class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 w-full">
        <button type="button" (click)="closeModal()" class="btn-secondary min-h-[44px]">Close</button>
        <button *ngIf="soapReport && !soapReport.isSigned" type="button" (click)="saveDraftOnly()" [disabled]="signing"
            class="btn-primary min-h-[44px] disabled:opacity-50">
            <i *ngIf="signing" class="fa-solid fa-spinner fa-spin"></i>
            <i *ngIf="!signing" class="fa-solid fa-floppy-disk"></i>
            <span>Save Reviewed Draft</span>
        </button>
    </div>
</app-modal-shell>

<app-clinical-dictation *ngIf="showDictation"
    modalTitle="Dictate Visit Note & Prescription"
    (closeModal)="showDictation = false"
    (dictationComplete)="applyDictation($event)">
</app-clinical-dictation>
