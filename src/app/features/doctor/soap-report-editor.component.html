<div *ngIf="isOpen"
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-950/85 backdrop-blur-md animate-fade-in">
    <div
        class="bg-gray-900 border border-gray-800 rounded-2xl max-w-4xl w-full p-6 shadow-2xl space-y-6 overflow-hidden max-h-[90vh] flex flex-col">

        <!-- Modal Header -->
        <div class="flex items-center justify-between border-b border-gray-800 pb-4 shrink-0">
            <div class="flex items-center gap-3">
                <div
                    class="w-10 h-10 rounded-xl bg-purple-500/20 text-purple-400 flex items-center justify-center font-bold">
                    <i class="fa-solid fa-file-medical text-lg"></i>
                </div>
                <div>
                    <h2 class="text-lg font-bold text-gray-100 flex items-center gap-2">
                        AI Ambient Scribe & SOAP Report Editor
                        <span *ngIf="soapReport && soapReport.isSigned"
                            class="px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 text-[10px] uppercase font-bold border border-emerald-500/40">
                            <i class="fa-solid fa-signature"></i> Signed
                        </span>
                    </h2>
                    <p class="text-xs text-gray-400">Appointment #{{ appointmentId }} &bull; Clinical Medical
                        Documentation</p>
                </div>
            </div>
            <button (click)="closeModal()"
                class="p-2 text-gray-400 hover:text-gray-200 hover:bg-gray-800 rounded-xl transition-colors">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>

        <!-- AI Scribe Draft Generator Tool -->
        <div *ngIf="soapReport && !soapReport.isSigned"
            class="bg-gray-950 border border-gray-800 rounded-xl p-4 space-y-3 shrink-0">
            <div class="flex items-center justify-between">
                <span class="text-xs font-semibold text-purple-400 uppercase tracking-wider flex items-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Ambient AI Scribe Assistant
                </span>
                <button (click)="generateDraft()" [disabled]="generating"
                    class="px-4 py-2 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 disabled:opacity-50 text-white text-xs font-bold rounded-lg transition-all shadow-md flex items-center gap-2">
                    <i *ngIf="generating" class="fa-solid fa-spinner fa-spin"></i>
                    <span>Generate AI SOAP Draft</span>
                </button>
            </div>
            <div>
                <input type="text" [(ngModel)]="transcriptInput"
                    placeholder="Paste or type consultation transcript notes (e.g. 'Patient reports fever of 101F for 2 days...')"
                    class="w-full bg-gray-900 border border-gray-800 rounded-lg p-2.5 text-xs text-gray-200 placeholder-gray-500 focus:outline-none focus:border-purple-500 transition-all" />
            </div>
        </div>

        <!-- Disclaimer Banner -->
        <div
            class="bg-amber-950/40 border border-amber-500/30 rounded-xl p-3 flex items-center gap-3 text-xs text-amber-300 shrink-0">
            <i class="fa-solid fa-triangle-exclamation text-amber-400 text-sm"></i>
            <span>AI Scribe draft requires physician review, editing, and electronic signature before
                finalization.</span>
        </div>

        <!-- Editable SOAP Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 overflow-y-auto pr-1 flex-1">

            <!-- Subjective -->
            <div class="space-y-1.5">
                <label class="text-xs font-bold text-gray-300 flex items-center gap-1.5 uppercase">
                    <span class="w-2 h-2 rounded-full bg-blue-400"></span> Subjective (Patient History & Symptoms)
                </label>
                <textarea [(ngModel)]="soapReport.subjective" [disabled]="soapReport.isSigned || false" rows="5"
                    placeholder="Patient reports symptoms, onset, location, severity..."
                    class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-xs text-gray-200 focus:outline-none focus:border-blue-500 transition-all disabled:opacity-60"></textarea>
            </div>

            <!-- Objective -->
            <div class="space-y-1.5">
                <label class="text-xs font-bold text-gray-300 flex items-center gap-1.5 uppercase">
                    <span class="w-2 h-2 rounded-full bg-emerald-400"></span> Objective (Vitals & Physical Exam)
                </label>
                <textarea [(ngModel)]="soapReport.objective" [disabled]="soapReport.isSigned || false" rows="5"
                    placeholder="Vital signs, physical findings, lab results..."
                    class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-xs text-gray-200 focus:outline-none focus:border-emerald-500 transition-all disabled:opacity-60"></textarea>
            </div>

            <!-- Assessment -->
            <div class="space-y-1.5">
                <label class="text-xs font-bold text-gray-300 flex items-center gap-1.5 uppercase">
                    <span class="w-2 h-2 rounded-full bg-amber-400"></span> Assessment (Diagnosis & Clinical Impression)
                </label>
                <textarea [(ngModel)]="soapReport.assessment" [disabled]="soapReport.isSigned || false" rows="5"
                    placeholder="Primary diagnosis, differential diagnoses..."
                    class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-xs text-gray-200 focus:outline-none focus:border-amber-500 transition-all disabled:opacity-60"></textarea>
            </div>

            <!-- Plan -->
            <div class="space-y-1.5">
                <label class="text-xs font-bold text-gray-300 flex items-center gap-1.5 uppercase">
                    <span class="w-2 h-2 rounded-full bg-purple-400"></span> Plan (Prescriptions, Orders & Follow-Up)
                </label>
                <textarea [(ngModel)]="soapReport.plan" [disabled]="soapReport.isSigned || false" rows="5"
                    placeholder="Medications, dosage, diagnostic orders, follow-up instructions..."
                    class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-xs text-gray-200 focus:outline-none focus:border-purple-500 transition-all disabled:opacity-60"></textarea>
            </div>

        </div>

        <!-- Footer Actions -->
        <div class="flex items-center justify-between border-t border-gray-800 pt-4 shrink-0">
            <button (click)="closeModal()"
                class="px-4 py-2.5 rounded-xl bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs font-semibold transition-all">
                Close
            </button>

            <div class="flex items-center gap-3" *ngIf="soapReport && !soapReport.isSigned">
                <button (click)="saveDraftOnly()" [disabled]="signing"
                    class="px-6 py-2.5 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 disabled:opacity-50 text-white font-bold text-xs transition-all shadow-lg shadow-purple-500/20 flex items-center gap-2">
                    <i *ngIf="signing" class="fa-solid fa-spinner fa-spin"></i>
                    <i *ngIf="!signing" class="fa-solid fa-floppy-disk"></i>
                    <span>Approve & Save SOAP Draft</span>
                </button>
            </div>
        </div>

    </div>
</div>
