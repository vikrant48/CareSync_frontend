<app-doctor-layout>
    <div class="max-w-7xl mx-auto p-4 sm:p-6 space-y-6">

        <!-- Header -->
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 sm:gap-4">
            <div>
                <h2 class="font-display text-lg sm:text-2xl font-bold text-gray-900 dark:text-white tracking-tight">My
                    Schedule</h2>
                <p class="text-gray-500 dark:text-gray-400 text-xs sm:text-sm mt-0.5">Manage your daily appointments and
                    patient flow</p>
            </div>
            <div class="flex items-center gap-2 sm:gap-3 self-end sm:self-auto">
                <div
                    class="bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 px-3 sm:px-4 py-1.5 sm:py-2 rounded-xl font-bold text-xs sm:text-sm">
                    {{ todayDate | date:'fullDate' }}
                </div>
                <button (click)="refreshToday()"
                    class="btn-secondary w-8 h-8 sm:w-10 sm:h-10 flex items-center justify-center p-0 rounded-xl text-xs sm:text-sm">
                    <i class="fa-solid fa-rotate" [class.animate-spin]="loading"></i>
                </button>
            </div>
        </div>

        <app-filter-bar [(expanded)]="isFilterExpanded" [activeCount]="scheduleFilterActiveCount"
            gridClass="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4" (clear)="resetFilters()">
            <div class="space-y-0.5">
                <label class="filter-label">Search</label>
                <div class="relative w-full">
                    <i
                        class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-xs sm:text-sm pointer-events-none z-10"></i>
                    <input type="text" [(ngModel)]="searchTerm" placeholder="Search patient name..."
                        class="filter-input-search">
                </div>
            </div>

            <div class="space-y-0.5">
                <app-select-dropdown label="Status" [(ngModel)]="filterStatus" [options]="statusFilterOptions"
                    (ngModelChange)="cdr.detectChanges()" placeholder="All Appointments">
                </app-select-dropdown>
            </div>
        </app-filter-bar>

        <app-skeleton *ngIf="loading" variant="card" [count]="6"
            wrapperClass="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></app-skeleton>

        <app-empty-state
            *ngIf="!loading && filteredAppointments().length === 0 && (filterStatus !== 'ALL' || searchTerm)"
            icon="fa-solid fa-calendar-xmark" title="No appointments found"
            message="Try adjusting your filters or search terms." [compact]="true" [hasAction]="true">
            <button type="button" (click)="resetFilters()"
                class="mt-2 text-xs sm:text-sm text-blue-600 font-bold hover:underline min-h-touch px-3">Clear
                Filters</button>
        </app-empty-state>
        <app-empty-state
            *ngIf="!loading && filteredAppointments().length === 0 && filterStatus === 'ALL' && !searchTerm"
            icon="fa-solid fa-calendar-xmark" title="No appointments found"
            message="You have no appointments scheduled for today." [compact]="true"></app-empty-state>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 animate-in slide-in-from-bottom-4 fade-in"
            *ngIf="!loading && filteredAppointments().length > 0">
            <doctor-appointment-card *ngFor="let a of filteredAppointments()" [appointment]="a"
                [showStatusSelect]="true" (viewPatient)="openPatient($event)"
                (openHistoryForm)="openHistoryForm($event)" (schedule)="schedule($event)" (confirm)="confirm($event)"
                (start)="start($event)" (complete)="complete($event)" (cancel)="cancel($event)"
                (joinVideo)="joinConsultation($event)" (statusChange)="changeStatus($event.appointment, $event.status)"
                (openChat)="openChat($event)" class="h-full"></doctor-appointment-card>
        </div>

        <!-- Modals -->
        <app-patient-details-modal [open]="showPatientModal" [patient]="selectedPatient"
            [history]="selectedPatientHistory" [documents]="selectedPatientDocuments" (close)="showPatientModal = false"
            (historyClick)="openHistory($event)"></app-patient-details-modal>

        <app-medical-history-detail-modal [open]="historyDetailModalOpen" [detail]="selectedHistoryDetail"
            [doctorInfo]="selectedHistoryDoctorInfo"
            (close)="historyDetailModalOpen = false"></app-medical-history-detail-modal>

        <app-medical-history-form-modal [open]="historyFormModalOpen" [form]="mhForm"
            [disabled]="selectedAppointment?.status !== 'IN_PROGRESS'" [saving]="savingHistory" [saved]="historySaved"
            [error]="historyError"
            [infoText]="selectedAppointment?.status === 'COMPLETED' ? 'This medical record is finalized and cannot be modified.' : (selectedAppointment?.status !== 'IN_PROGRESS' ? 'Form available only for in-progress appointments.' : null)"
            (close)="closeHistoryForm()" (submit)="saveMedicalHistory()"></app-medical-history-form-modal>

        <!-- Shared Chat Modal -->
        <app-shared-chat-modal [isOpen]="chatOpen" [appointmentId]="chatAppointmentId"
            [participantName]="chatParticipantName" [participantImage]="chatParticipantImage"
            (close)="closeChat()"></app-shared-chat-modal>

    </div>
</app-doctor-layout>
