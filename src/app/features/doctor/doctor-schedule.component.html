<app-doctor-layout>
    <div
        class="max-w-[1400px] mx-auto p-4 sm:p-6 space-y-6 text-[var(--text)] font-sans selection:bg-[var(--accent)]/30">

        <!-- Page Header with Ambient Graphic Wave -->
        <div
            class="relative overflow-hidden rounded-2xl bg-gradient-to-r from-[var(--accent-soft)] via-[var(--panel)] to-[var(--primary-soft)] border border-[var(--border)] p-6 sm:p-8 shadow-2xl">
            <!-- Ambient Backdrop Graphic -->
            <div
                class="absolute -top-12 -right-12 w-64 h-64 bg-[var(--primary)]/10 rounded-full blur-3xl pointer-events-none">
            </div>

            <div class="relative z-10 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                <div>
                    <h1 class="text-2xl sm:text-3xl font-black text-[var(--text)] tracking-tight">My Schedule</h1>
                    <p class="text-xs sm:text-sm text-[var(--muted)] font-medium mt-1">Manage your daily appointments
                        and
                        patient flow</p>
                </div>

                <div class="flex items-center gap-3">
                    <div
                        class="bg-[var(--bg)] text-[var(--primary)] border border-[var(--bg)] px-4 py-2 rounded-xl font-extrabold text-xs sm:text-sm shadow-sm">
                        {{ todayDate | date:'EEEE, MMMM d, yyyy' }}
                    </div>
                    <button type="button" (click)="refreshToday()"
                        class="w-10 h-10 rounded-xl bg-[var(--bg)] hover:bg-[var(--bg)] border border-[var(--bg)] text-[var(--primary)] flex items-center justify-center text-sm transition-all cursor-pointer shadow-sm"
                        title="Refresh Schedule">
                        <i class="fa-solid fa-rotate" [class.animate-spin]="loading"></i>
                    </button>
                </div>
            </div>
        </div>

        <app-filter-bar [filters]="scheduleFilterConfigs" [values]="scheduleFilterValues" [theme]="'doctor'"
            (filterChange)="onFilterBarChange($event)">
        </app-filter-bar>

        <!-- 4 KPI Stat Cards Row -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-2.5 sm:gap-4">
            <!-- Stat 1: Total Appointments -->
            <div
                class="bg-[var(--panel)] border border-[var(--border)] rounded-xl sm:rounded-2xl p-3 sm:p-4 shadow-xl flex items-center gap-2.5 sm:gap-4 transition-all hover:border-[var(--accent)]/40 min-w-0">
                <div
                    class="w-9 h-9 sm:w-12 sm:h-12 rounded-xl sm:rounded-2xl bg-[var(--bg)] text-[var(--primary)] flex items-center justify-center text-base sm:text-xl shrink-0 shadow-inner">
                    <i class="fa-regular fa-calendar-check"></i>
                </div>
                <div class="min-w-0">
                    <div class="text-[11px] font-semibold text-[var(--muted)] truncate">Total Appointments</div>
                    <div class="text-2xl font-extrabold text-[var(--text)] mt-0.5" *ngIf="!loading">
                        {{ totalCount }}
                    </div>
                    <div class="h-6 w-12 bg-[var(--bg)] rounded animate-pulse" *ngIf="loading"></div>
                </div>
            </div>

            <!-- Stat 2: Confirmed -->
            <div
                class="bg-[var(--panel)] border border-[var(--border)] rounded-xl sm:rounded-2xl p-3 sm:p-4 shadow-xl flex items-center gap-2.5 sm:gap-4 transition-all hover:border-[var(--accent)]/40 min-w-0">
                <div
                    class="w-9 h-9 sm:w-12 sm:h-12 rounded-xl sm:rounded-2xl bg-[var(--accent-soft)] text-[var(--accent)] flex items-center justify-center text-base sm:text-xl shrink-0 shadow-inner">
                    <i class="fa-solid fa-circle-check"></i>
                </div>
                <div class="min-w-0">
                    <div class="text-[11px] font-semibold text-[var(--muted)] truncate">Confirmed</div>
                    <div class="text-2xl font-extrabold text-[var(--text)] mt-0.5">
                        {{ confirmedCount }}
                    </div>
                </div>
            </div>

            <!-- Stat 3: Pending -->
            <div
                class="bg-[var(--panel)] border border-[var(--border)] rounded-xl sm:rounded-2xl p-3 sm:p-4 shadow-xl flex items-center gap-2.5 sm:gap-4 transition-all hover:border-[var(--accent)]/40 min-w-0">
                <div
                    class="w-9 h-9 sm:w-12 sm:h-12 rounded-xl sm:rounded-2xl bg-[var(--accent-soft)] text-amber-700 dark:text-amber-400 flex items-center justify-center text-base sm:text-xl shrink-0 shadow-inner">
                    <i class="fa-regular fa-clock"></i>
                </div>
                <div class="min-w-0">
                    <div class="text-[11px] font-semibold text-[var(--muted)] truncate">Booked</div>
                    <div class="text-2xl font-extrabold text-[var(--text)] mt-0.5">
                        {{ pendingCount }}
                    </div>
                </div>
            </div>

            <!-- Stat 4: Cancelled -->
            <div
                class="bg-[var(--panel)] border border-[var(--border)] rounded-xl sm:rounded-2xl p-3 sm:p-4 shadow-xl flex items-center gap-2.5 sm:gap-4 transition-all hover:border-[var(--accent)]/40 min-w-0">
                <div
                    class="w-9 h-9 sm:w-12 sm:h-12 rounded-xl sm:rounded-2xl bg-[var(--danger-soft)] text-rose-700 dark:text-rose-400 flex items-center justify-center text-base sm:text-xl shrink-0 shadow-inner">
                    <i class="fa-solid fa-circle-xmark"></i>
                </div>
                <div class="min-w-0">
                    <div class="text-[11px] font-semibold text-[var(--muted)] truncate">Cancelled</div>
                    <div class="text-2xl font-extrabold text-[var(--text)] mt-0.5">
                        {{ cancelledCount }}
                    </div>
                </div>
            </div>
        </div>

        <!-- Loading Skeleton -->
        <app-page-loader *ngIf="loading" label="Loading schedule..." accent="doctor"></app-page-loader>

        <!-- Empty States -->
        <app-empty-state
            *ngIf="!loading && filteredAppointments().length === 0 && (filterStatus !== 'ALL' || searchTerm)"
            icon="fa-solid fa-calendar-xmark" title="No appointments found"
            message="Try adjusting your filters or search terms." [compact]="true" [hasAction]="true">
            <button type="button" (click)="resetFilters()"
                class="mt-2 text-xs font-bold text-[var(--accent)] hover:underline px-3 py-1">Clear Filters</button>
        </app-empty-state>
        <app-empty-state
            *ngIf="!loading && filteredAppointments().length === 0 && filterStatus === 'ALL' && !searchTerm"
            icon="fa-solid fa-calendar-xmark" title="No appointments scheduled"
            message="You have no appointments scheduled for today." [compact]="true"></app-empty-state>

        <!-- Appointment Cards Grid (Preserved Untouched) -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"
            *ngIf="!loading && filteredAppointments().length > 0">
            <app-appointment-card *ngFor="let a of filteredAppointments()" [appointment]="a" viewerRole="DOCTOR"
                class="h-full"></app-appointment-card>
        </div>

        <!-- Modals Preserved -->
        <app-patient-details-modal [open]="showPatientModal" [patient]="selectedPatient"
            [history]="selectedPatientHistory" [documents]="selectedPatientDocuments" (close)="showPatientModal = false"
            (historyClick)="openHistory($event)"></app-patient-details-modal>

        <app-medical-history-detail-modal [open]="historyDetailModalOpen" [detail]="selectedHistoryDetail"
            [doctorInfo]="selectedHistoryDoctorInfo"
            (close)="historyDetailModalOpen = false"></app-medical-history-detail-modal>

        <app-medical-history-form-modal [open]="historyFormModalOpen" [form]="mhForm"
            [disabled]="selectedAppointment?.status !== 'IN_PROGRESS'" [saving]="savingHistory" [saved]="historySaved"
            [error]="historyError"
            [infoText]="selectedAppointment?.status === 'COMPLETED' ? 'This medical record is finalized and cannot be modified.' : (selectedAppointment?.status !== 'IN_PROGRESS' ? 'Form available only for in-progress appointments.' : null)"
            (close)="closeHistoryForm()" (submit)="saveMedicalHistory()"></app-medical-history-form-modal>

        <!-- Shared Chat Modal -->
        <app-shared-chat-modal [isOpen]="chatOpen" [appointmentId]="chatAppointmentId"
            [participantName]="chatParticipantName" [participantImage]="chatParticipantImage"
            (close)="closeChat()"></app-shared-chat-modal>

    </div>
</app-doctor-layout>
