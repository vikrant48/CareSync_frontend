<div class="h-full w-full surface p-3 sm:p-5 shadow-sm flex flex-col space-y-3 sm:space-y-4">
  <div class="flex items-center justify-between gap-3 pb-1">
    <h2 class="text-sm font-extrabold text-[var(--text)] tracking-tight min-w-0">Today's Schedule</h2>
    <a routerLink="/doctor/schedule" class="shrink-0 whitespace-nowrap text-xs font-bold text-[var(--primary)] hover:underline">View All</a>
  </div>

  <app-page-loader *ngIf="loading" label="Loading schedule..." accent="doctor" [compact]="true"></app-page-loader>

  <div *ngIf="!loading && appointments.length > 0" class="space-y-2.5 flex-1">
    <div *ngFor="let a of appointments; trackBy: trackAppointment"
         class="inset-surface surface-hover p-3 flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between sm:p-3.5 transition-all cursor-pointer group"
         role="link" tabindex="0"
         (click)="openPatient.emit(a.isReal ? a : null)"
         (keydown.enter)="openPatient.emit(a.isReal ? a : null)"
         [attr.aria-label]="'Open appointment for ' + a.patientName">
      <div class="flex items-start gap-3 min-w-0 w-full sm:w-auto">
        <img *ngIf="a.patientProfileImageUrl; else patientAvatar" [src]="a.patientProfileImageUrl" [alt]="a.patientName"
             class="w-11 h-11 rounded-full object-cover ring-2 ring-[var(--border)] shrink-0"
             onerror="this.src='assets/default-profile.png'" />
        <ng-template #patientAvatar>
          <div class="w-11 h-11 rounded-full bg-gradient-to-tr from-[var(--primary)] to-indigo-600 text-white flex items-center justify-center font-bold text-sm shrink-0 ring-2 ring-[var(--border)]">
            {{ (a.patientName || 'P').charAt(0) }}
          </div>
        </ng-template>
        <div class="flex flex-col min-w-0 flex-1">
          <div class="flex items-start justify-between gap-2">
            <h4 class="text-sm font-bold text-[var(--text)] truncate group-hover:text-[var(--primary)] transition-colors">
              {{ a.patientName }}
            </h4>
            <i class="fa-solid fa-chevron-right text-muted text-xs shrink-0 mt-1 sm:hidden" aria-hidden="true"></i>
          </div>
          <span class="text-xs text-muted truncate font-medium">{{ a.reason || 'Not provided' }}</span>
          <span *ngIf="a.patientActive === false"
                class="w-fit mt-1 text-[10px] font-bold uppercase px-2 py-0.5 rounded-full bg-rose-500/10 text-rose-600 border border-rose-500/20">
            Patient inactive
          </span>
          <div class="hidden sm:flex items-center gap-3 text-[11px] text-muted mt-1.5">
            <span class="inline-flex items-center gap-1.5 font-medium whitespace-nowrap">
              <i class="fa-regular fa-calendar text-[var(--primary)]"></i>
              {{ a.appointmentDate }}
            </span>
            <span class="inline-flex items-center gap-1.5 font-medium whitespace-nowrap">
              <i class="fa-regular fa-clock text-[var(--primary)]"></i>
              {{ a.appointmentTime }}
            </span>
          </div>
        </div>
      </div>
      <div class="flex sm:hidden items-center gap-2 min-w-0 flex-nowrap">
        <span class="inline-flex items-center gap-1 font-medium whitespace-nowrap text-[11px] text-muted shrink-0">
          <i class="fa-regular fa-calendar text-[var(--primary)]"></i>
          {{ a.appointmentDate }}
        </span>
        <span class="inline-flex items-center gap-1 font-medium whitespace-nowrap text-[11px] text-muted shrink-0">
          <i class="fa-regular fa-clock text-[var(--primary)]"></i>
          {{ a.appointmentTime }}
        </span>
        <app-status-badge class="ml-auto shrink-0" [status]="a.status" size="sm"></app-status-badge>
      </div>
      <div class="hidden sm:flex items-center gap-2.5 shrink-0 ml-2">
        <app-status-badge [status]="a.status" size="md"></app-status-badge>
        <i class="fa-solid fa-chevron-right text-muted group-hover:text-[var(--text)] text-xs group-hover:translate-x-0.5 transition-all"></i>
      </div>
    </div>
  </div>

  <div *ngIf="!loading && appointments.length === 0" class="flex-1 flex items-center justify-center w-full">
    <app-empty-state
      class="w-full"
      icon="fa-solid fa-calendar-day"
      title="No Appointments Today"
      message="Your schedule is clear for today."
      iconWrapClass="bg-[var(--bg)] text-[var(--primary)]"
      containerClass="w-full"
      [compact]="true"
      [hasAction]="true"
    >
      <a routerLink="/doctor/schedule" class="inline-flex items-center min-h-[44px] px-4 rounded-xl bg-[var(--primary)] text-[var(--primary-fg)] text-xs font-bold hover:bg-[var(--primary-hover)] transition-all">
        Manage Schedule
      </a>
    </app-empty-state>
  </div>
</div>
