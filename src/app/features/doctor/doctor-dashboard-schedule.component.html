<div class="h-full w-full surface p-5 shadow-sm flex flex-col space-y-4">
  <div class="flex items-center justify-between gap-3 pb-1">
    <h2 class="text-sm font-extrabold text-[var(--text)] tracking-tight min-w-0">Today's Schedule</h2>
    <a routerLink="/doctor/schedule" class="shrink-0 whitespace-nowrap text-xs font-bold text-[var(--primary)] hover:underline">View All</a>
  </div>

  <app-skeleton *ngIf="loading" variant="list"></app-skeleton>

  <div *ngIf="!loading && appointments.length > 0" class="space-y-3.5 flex-1">
    <div *ngFor="let a of appointments; trackBy: trackAppointment"
         class="flex items-center justify-between gap-3 group border-b border-[var(--border)] pb-2.5 last:border-b-0">
      <div class="flex items-center gap-3 min-w-0">
        <div class="flex items-center gap-2 text-xs font-bold text-[var(--primary)] shrink-0 w-20">
          <span class="w-2 h-2 rounded-full"
                [ngClass]="{
                  'bg-emerald-400': a.status === 'CONFIRMED' || a.status === 'IN_PROGRESS',
                  'bg-blue-400': a.status === 'SCHEDULED' || a.status === 'BOOKED',
                  'bg-rose-400': a.status === 'CANCELLED'
                }"></span>
          <span>{{ a.appointmentTime }}</span>
        </div>
        <div class="flex items-center gap-2.5 min-w-0">
          <div class="w-8 h-8 rounded-full overflow-hidden border border-[var(--border)] bg-[var(--bg)] shrink-0">
            <img [src]="a.patientProfileImageUrl || 'assets/default-profile.png'" class="w-full h-full object-cover" onerror="this.src='assets/default-profile.png'" />
          </div>
          <div class="min-w-0">
            <div class="text-xs font-extrabold text-[var(--text)] group-hover:text-[var(--primary)] transition-colors truncate">
              {{ a.patientName }}
            </div>
            <span *ngIf="a.patientActive === false"
                  class="inline-flex text-[9px] font-bold uppercase px-1.5 py-0.5 rounded bg-rose-500/10 text-rose-600 border border-rose-500/20">
              Inactive patient
            </span>
            <div class="text-[10px] text-muted font-medium truncate">
              {{ a.reason }}
            </div>
          </div>
        </div>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <span [ngClass]="getStatusBadgeClass(a.status)"
              class="px-2.5 py-1 rounded-lg text-[10px] font-bold uppercase tracking-wider">
          {{ getStatusLabel(a.status) }}
        </span>
        <button type="button" (click)="openPatient.emit(a.isReal ? a : null)"
                class="min-w-[44px] min-h-[44px] rounded-lg hover:bg-[var(--bg)] text-muted hover:text-[var(--text)] flex items-center justify-center text-xs transition-colors cursor-pointer"
                aria-label="Open patient details">
          <i class="fa-solid fa-ellipsis-vertical" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </div>

  <div *ngIf="!loading && appointments.length === 0" class="flex-1 flex items-center justify-center w-full">
    <app-empty-state
      class="w-full"
      icon="fa-solid fa-calendar-day"
      title="No Appointments Today"
      message="Your schedule is clear for today."
      iconWrapClass="bg-[var(--bg)] text-[var(--primary)]"
      containerClass="w-full"
      [compact]="true"
      [hasAction]="true"
    >
      <a routerLink="/doctor/schedule" class="inline-flex items-center min-h-[44px] px-4 rounded-xl bg-[var(--primary)] text-[var(--primary-fg)] text-xs font-bold hover:bg-[var(--primary-hover)] transition-all">
        Manage Schedule
      </a>
    </app-empty-state>
  </div>
</div>
