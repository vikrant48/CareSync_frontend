<app-patient-layout>
    <div class="max-w-[1400px] mx-auto p-3 sm:p-5">
        <doctor-details-panel *ngIf="doctor; else loadingTpl" [doctor]="doctor" [avgRating]="avgRating" [age]="age"
            [educations]="educations" [experiences]="experiences" [certificates]="certificates" [enableBooking]="true"
            (openBooking)="startBooking()"></doctor-details-panel>

        <!-- Booking Modal (Shared) -->
        <app-doctor-booking-modal [open]="bookingOpen" [doctor]="doctor" [experienceYears]="experienceYears"
            (close)="closeBooking()" (proceedToPayment)="onProceedToPayment($event)"></app-doctor-booking-modal>

        <!-- Payment Modal -->
        <app-payment-popup [isVisible]="paymentModalOpen" [amount]="doctor?.consultationFees || 0"
            [title]="'Appointment Booking Payment'" [patientId]="getCurrentPatientId()"
            [appointmentBookingDetails]="appointmentBookingDetails" [paymentType]="'APPOINTMENT'"
            [additionalInfo]="getAppointmentInfo()" (paymentSuccess)="onPaymentSuccess($event)"
            (paymentCancel)="closePaymentModal()" (paymentError)="onPaymentError($event)"></app-payment-popup>

        <ng-template #loadingTpl>
            <app-page-loader label="Loading doctor profile..."></app-page-loader>
        </ng-template>
    </div>
</app-patient-layout>
