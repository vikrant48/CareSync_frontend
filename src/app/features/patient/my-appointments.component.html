    <app-page-container extraClass="pb-28">

        <app-page-header variant="hero" title="My Appointments"
            subtitle="Manage and track your scheduled consultations" [hasActions]="true">
            <a routerLink="/patient/book-appointment"
                class="btn-size-lg px-4 rounded-xl bg-[var(--primary)] hover:bg-[var(--primary-hover)] text-white text-xs font-bold shadow-lg shadow-[var(--primary)]/25 inline-flex items-center gap-2 transition-all shrink-0">
                <i class="fa-solid fa-circle-plus text-xs" aria-hidden="true"></i>
                <span>Book New Appointment</span>
            </a>
        </app-page-header>

        <!-- Filter Bar -->
        <app-filter-bar [filters]="patientFilterConfigs" [values]="patientFilterValues" [theme]="'patient'"
            (filterChange)="onFilterBarChange($event)">
        </app-filter-bar>

        <!-- Summary & Sort Toolbar -->
        <div class="flex items-center justify-between gap-2 py-1">
            <div class="text-xs font-medium text-[var(--muted)] whitespace-nowrap">
                <span class="hidden sm:inline">Showing </span><span class="font-bold text-[var(--text)]">{{ filtered().length }}</span> of <span
                    class="font-bold text-[var(--primary)]">{{ appointments.length }}</span>
                <span class="hidden sm:inline"> appointments</span><span class="sm:hidden"> appts</span>
            </div>

            <div class="flex items-center gap-2 shrink-0">
                <span class="text-xs text-[var(--muted)] font-medium whitespace-nowrap">Sort by</span>
                <select
                    class="compact-select bg-[var(--panel)] border border-[var(--border)] rounded-xl px-2.5 sm:px-3 py-1.5 text-xs text-[var(--text)] font-semibold focus:outline-none focus:border-[var(--primary)] cursor-pointer">
                    <option value="upcoming">Upcoming First</option>
                    <option value="recent">Most Recent</option>
                </select>
            </div>
        </div>

        <app-page-loader *ngIf="loading" label="Loading appointments..."></app-page-loader>

        <!-- Empty State -->
        <app-empty-state *ngIf="!loading && filtered().length === 0 && appointments.length === 0"
            icon="fa-solid fa-calendar-xmark" title="No Appointments Found"
            message="You haven't booked any appointments yet."
            containerClass="bg-[var(--panel)] rounded-2xl border border-[var(--border)] border-dashed px-4 py-8"
            [hasAction]="true">
            <a routerLink="/patient/book-appointment"
                class="btn-size-lg px-4 rounded-xl bg-[var(--primary)] hover:bg-[var(--primary-hover)] text-white text-xs font-bold shadow-md transition-all inline-flex items-center justify-center">Book
                Now</a>
        </app-empty-state>

        <app-empty-state *ngIf="!loading && filtered().length === 0 && appointments.length > 0"
            icon="fa-solid fa-calendar-xmark" title="No Appointments Found"
            message="No appointments match your current filters."
            containerClass="bg-[var(--panel)] rounded-2xl border border-[var(--border)] border-dashed px-4 py-8"
            [hasAction]="true">
            <button type="button" (click)="clearFilters()"
                class="btn-size-md px-4 rounded-xl bg-[var(--bg)] hover:bg-[var(--border)] text-[var(--primary)] text-xs font-bold border border-[var(--border)] transition-all inline-flex items-center justify-center">Clear
                Filters</button>
        </app-empty-state>

        <!-- Appointments Grid (3 Columns on Desktop matching Reference Screenshot 1) -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 animate-fade-in"
            *ngIf="!loading && filtered().length > 0">
            <app-appointment-card *ngFor="let a of filtered(); trackBy: trackByAppointmentId" [appointment]="a" viewerRole="PATIENT"
                class="h-full" (reschedule)="startReschedule($event)" (cancel)="cancelAppointment($event)"
                (openChat)="openChat($event)"></app-appointment-card>
        </div>

        <!-- Reschedule Modal (shared) -->
        <reschedule-appointment-modal [appointment]="rescheduleTarget" [doctors]="doctors" (close)="closeReschedule()"
            (confirmed)="onRescheduleConfirmed($event)"></reschedule-appointment-modal>

        <!-- Cancellation Modal -->
        <app-cancellation-modal [appointment]="cancellationTarget" (close)="closeCancellation()"
            (confirmCancel)="confirmCancellation()"
            (requestReschedule)="handleRescheduleFromCancellation()"></app-cancellation-modal>

        <!-- Shared Chat Modal -->
        <app-shared-chat-modal [isOpen]="chatOpen" [appointmentId]="chatAppointmentId"
            [participantName]="chatParticipantName" [participantImage]="chatParticipantImage"
            (close)="closeChat()"></app-shared-chat-modal>
    </app-page-container>
