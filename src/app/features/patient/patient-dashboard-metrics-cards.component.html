<section class="mt-3">
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <app-stat-card label="Pending Feedback" icon="fa-solid fa-file-signature" tone="primary"
            [value]="pendingFeedbackCount" [loading]="loadingPending" [clickable]="true"
            (cardClick)="openFeedback.emit()"></app-stat-card>
        <app-stat-card label="My Appointments" icon="fa-solid fa-calendar-days" tone="info"
            [value]="(appointments || []).length" [loading]="loadingAppointments" [clickable]="true"
            (cardClick)="openMyAppointments.emit()"></app-stat-card>
        <app-stat-card label="Today" icon="fa-solid fa-calendar-day" tone="warning"
            [value]="todayAppointmentsCount" [loading]="loadingAppointments" [clickable]="true"
            (cardClick)="openTodayAppointments.emit()"></app-stat-card>
        <app-stat-card label="Lab Tests" icon="fa-solid fa-vial-virus" tone="success"
            [value]="labTestCount" [loading]="loadingLabTests" [clickable]="true"
            (cardClick)="openLabTests.emit()"></app-stat-card>
    </div>
</section>
