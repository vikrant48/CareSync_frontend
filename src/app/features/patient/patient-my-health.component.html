<!-- My Health -->
<section class="mt-3">
    <h3 class="text-xs font-bold text-[var(--text)] uppercase tracking-wide mb-2">My Health</h3>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5">
        <!-- Recent History -->
        <div
            class="surface p-3.5 h-full shadow-sm transition surface-hover">
            <div class="flex items-center justify-between mb-2.5 border-b border-[var(--border)] pb-1.5">
                <div class="font-bold text-xs text-[var(--text)] uppercase tracking-wide flex items-center gap-2">
                    <i class="fa-solid fa-clock-rotate-left text-[var(--primary)]"></i> Recent History
                </div>
                <a routerLink="/patient/profile"
                    class="text-[11px] text-[var(--primary)] hover:text-[var(--primary-hover)] font-semibold inline-flex items-center px-1">View
                    All</a>
            </div>
            <ul class="space-y-1.5">
                <li *ngFor="let item of medicalHistoryRecent" (click)="openHistoryDetail.emit(item.id)"
                    (keydown.enter)="openHistoryDetail.emit(item.id)" tabindex="0" role="button"
                    class="cursor-pointer inset-surface rounded-lg p-2.5 transition-colors surface-hover group focus:outline-none focus:ring-1 focus:ring-[var(--primary)]/40">
                    <div class="flex items-center justify-between mb-0.5">
                        <div
                            class="font-semibold text-xs text-[var(--text)] group-hover:text-[var(--primary)] transition-colors truncate pr-2">
                            {{ item.diagnosis || 'Diagnosis' }}</div>
                        <div
                            class="text-[9px] font-medium text-muted bg-[var(--bg)] px-1.5 py-0.5 rounded border border-[var(--border)]">
                            {{ item.visitDate | date:'shortDate' }}</div>
                    </div>
                    <div class="text-[11px] text-muted truncate">{{ item.symptoms || item.treatment || 'No details'
                        }}</div>
                </li>
                <li *ngIf="medicalHistoryRecent.length === 0">
                    <app-empty-state icon="fa-solid fa-clock-rotate-left" title="" message="No recent history."
                        [compact]="true"></app-empty-state>
                </li>
            </ul>
        </div>

        <!-- Test Results -->
        <div
            class="surface p-3.5 h-full shadow-sm transition surface-hover">
            <div class="flex items-center justify-between mb-2.5 border-b border-[var(--border)] pb-1.5">
                <div class="font-bold text-xs text-[var(--text)] uppercase tracking-wide flex items-center gap-2">
                    <i class="fa-solid fa-flask text-purple-700 dark:text-purple-400"></i> Test Results
                </div>
                <a routerLink="/patient/lab-bookings"
                    class="text-[11px] text-purple-700 dark:text-purple-400 hover:text-purple-300 font-semibold inline-flex items-center px-1">View
                    All</a>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                <div *ngFor="let d of patientLabReports"
                    class="inset-surface rounded-lg p-2.5 cursor-pointer surface-hover transition-all group focus:outline-none focus:ring-1 focus:ring-purple-500/40"
                    (click)="openDocument.emit(d)" (keydown.enter)="openDocument.emit(d)" tabindex="0" role="button">
                    <div class="flex items-center gap-2.5">
                        <div
                            class="w-7 h-7 rounded bg-purple-500/10 text-purple-700 dark:text-purple-400 flex items-center justify-center text-xs shrink-0">
                            <i class="fa-regular fa-file-pdf"></i>
                        </div>
                        <div class="min-w-0">
                            <div
                                class="font-semibold text-xs text-[var(--text)] truncate group-hover:text-purple-700 dark:text-purple-400 transition-colors">
                                {{ d.filename }}</div>
                            <div class="text-[9px] text-muted">{{ d.uploadDate | date:'mediumDate' }}</div>
                        </div>
                    </div>
                </div>
                <div *ngIf="patientLabReports.length === 0" class="col-span-2">
                    <app-empty-state icon="fa-solid fa-flask" title="" message="No lab reports available."
                        [compact]="true"
                        iconWrapClass="bg-purple-100 dark:bg-purple-500/10 text-purple-500"></app-empty-state>
                </div>
            </div>
        </div>
    </div>
</section>
