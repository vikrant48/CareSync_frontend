<div
    class="min-h-[calc(100dvh-3.5rem)] bg-gray-50 dark:bg-gray-950 flex flex-col justify-center py-8 px-4 sm:px-6 lg:px-8 relative overflow-hidden transition-colors duration-300">

    <!-- Background Elements -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
        <div
            class="absolute -top-40 -left-40 w-96 h-96 bg-purple-500/10 rounded-full blur-3xl opacity-50 dark:opacity-20 animate-pulse-slow">
        </div>
        <div
            class="absolute top-1/2 right-0 w-80 h-80 bg-blue-500/10 rounded-full blur-3xl opacity-50 dark:opacity-20 translate-x-1/2">
        </div>
    </div>

    <div class="sm:mx-auto sm:w-full sm:max-w-md relative z-10">

        <!-- Header -->
        <div class="text-center mb-8">
            <h2 class="text-3xl font-extrabold text-gray-900 dark:text-white tracking-tight">Reset Password</h2>
            <p class="mt-2 text-sm text-gray-600 dark:text-gray-400">Recover your account access securely</p>
        </div>

        <div
            class="bg-white dark:bg-gray-800 shadow-2xl shadow-gray-200/50 dark:shadow-gray-900/50 rounded-2xl sm:rounded-3xl border border-gray-100 dark:border-gray-700 backdrop-blur-sm overflow-hidden flex flex-col">

            <div class="p-8 space-y-6">

                <!-- Step 1: Request OTP -->
                <section *ngIf="!verified && otpStage === 'hidden'"
                    class="space-y-6 animate-in fade-in slide-in-from-right-4 duration-300">
                    <div class="text-center">
                        <div
                            class="w-16 h-16 bg-blue-50 dark:bg-blue-900/20 rounded-full flex items-center justify-center mx-auto mb-4 text-blue-500">
                            <i class="fa-solid fa-envelope text-2xl" aria-hidden="true"></i>
                        </div>
                        <h3 class="text-lg font-semibold text-gray-900 dark:text-white">Forgot your password?</h3>
                        <p class="text-sm text-gray-500 dark:text-gray-400 px-4">Enter your registered email address and
                            we'll send you a verification code.</p>
                    </div>

                    <div class="form-group">
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Email
                            Address</label>
                        <div class="relative">
                            <input type="email" class="input-modern" [(ngModel)]="forgotEmail"
                                placeholder="you@example.com" [class.opacity-50]="forgotLoading"
                                [disabled]="forgotLoading" />
                        </div>
                    </div>

                    <button class="btn-primary w-full rounded-xl shadow-lg shadow-blue-500/20"
                        (click)="requestOtp()" [disabled]="forgotLoading">
                        <span *ngIf="!forgotLoading">Send Verification Code <i
                                class="fa-solid fa-arrow-right ml-2" aria-hidden="true"></i></span>
                        <span *ngIf="forgotLoading"><i class="fa-solid fa-circle-notch fa-spin mr-2" aria-hidden="true"></i>
                            Sending...</span>
                    </button>
                </section>


                <!-- Step 2: Verify OTP -->
                <section *ngIf="!verified && otpStage === 'visible'"
                    class="space-y-6 animate-in fade-in slide-in-from-right-4 duration-300">
                    <div class="text-center">
                        <div
                            class="w-16 h-16 bg-purple-50 dark:bg-purple-900/20 rounded-full flex items-center justify-center mx-auto mb-4 text-purple-500">
                            <i class="fa-solid fa-shield-halved text-2xl" aria-hidden="true"></i>
                        </div>
                        <h3 class="text-lg font-semibold text-gray-900 dark:text-white">Verify OTP</h3>
                        <p class="text-sm text-gray-500 dark:text-gray-400">Enter the 6-digit code sent to <span
                                class="font-medium text-gray-700 dark:text-gray-300">{{ forgotEmail }}</span></p>
                        <button (click)="changeEmail()"
                            class="text-xs text-blue-500 hover:text-blue-600 underline mt-1">Change email</button>
                    </div>

                    <div class="form-group">
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" for="reset-password-verification-code-1">Verification
                            Code</label>
                        <input id="reset-password-verification-code-1" type="text" class="input-modern text-center text-2xl tracking-[0.5em] py-3 font-mono"
                            [(ngModel)]="otp" maxlength="6" placeholder="••••••" />
                    </div>

                    <div class="space-y-3">
                        <button class="btn-primary w-full rounded-xl shadow-lg shadow-purple-500/20"
                            (click)="verifyOtp()" [disabled]="verifyLoading || !otp || otp.length !== 6">
                            <span *ngIf="!verifyLoading">Verify Code <i class="fa-solid fa-check ml-2" aria-hidden="true"></i></span>
                            <span *ngIf="verifyLoading"><i class="fa-solid fa-circle-notch fa-spin mr-2" aria-hidden="true"></i>
                                Verifying...</span>
                        </button>

                        <div class="text-center">
                            <button
                                class="text-sm font-medium text-gray-500 hover:text-gray-700 dark:hover:text-gray-300 transition-colors"
                                (click)="resendOtp()" [disabled]="resendCooldown > 0 || forgotLoading"
                                [class.opacity-50]="resendCooldown > 0 || forgotLoading">
                                <i class="fa-solid fa-rotate-right mr-1" [class.fa-spin]="forgotLoading" aria-hidden="true"></i>
                                {{ resendCooldown > 0 ? ('Resend in ' + resendCooldown + 's') : 'Resend Code' }}
                            </button>
                        </div>
                    </div>
                </section>

            </div>

            <div
                class="bg-gray-50 dark:bg-gray-700/30 px-6 py-4 border-t border-gray-100 dark:border-gray-700 text-center">
                <p class="text-sm text-gray-600 dark:text-gray-400">
                    Remembered your password? <a routerLink="/login"
                        class="font-medium text-blue-600 hover:text-blue-500 dark:text-blue-400 transition-colors">Sign
                        in</a>
                </p>
            </div>

        </div>
    </div>

    <app-modal-shell [open]="showResetModal" title="Create New Password" titleId="reset-password-title"
        icon="fa-solid fa-key" iconWrapClass="bg-emerald-50 dark:bg-emerald-900/20 text-emerald-700 dark:text-emerald-300"
        maxWidthClass="max-w-md" [hasFooter]="true" footerClass="p-4 flex flex-col-reverse sm:flex-row sm:justify-end gap-2"
        (close)="closeResetModal()">
        <p class="text-sm text-muted mb-4">Code verified. Enter your new password below.</p>
        <div class="space-y-4">
            <div>
                <label class="form-label" for="reset-new-password">New Password</label>
                <div class="relative">
                    <input id="reset-new-password" [type]="showNewPassword ? 'text' : 'password'" class="form-input pr-12"
                        [(ngModel)]="resetForm.newPassword" placeholder="New password" />
                    <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-muted min-w-[44px] min-h-[44px]"
                        (click)="showNewPassword = !showNewPassword" [attr.aria-label]="showNewPassword ? 'Hide password' : 'Show password'">
                        <i [class]="showNewPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
            <div>
                <label class="form-label" for="reset-confirm-password">Confirm New Password</label>
                <div class="relative">
                    <input id="reset-confirm-password" [type]="showConfirmPassword ? 'text' : 'password'" class="form-input pr-12"
                        [(ngModel)]="resetForm.confirmPassword" placeholder="Confirm password" />
                    <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-muted min-w-[44px] min-h-[44px]"
                        (click)="showConfirmPassword = !showConfirmPassword" [attr.aria-label]="showConfirmPassword ? 'Hide password' : 'Show password'">
                        <i [class]="showConfirmPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
        </div>
        <button modalFooter type="button" (click)="closeResetModal()" class="btn-secondary">Cancel</button>
        <button modalFooter type="button" (click)="resetWithOtp()" [disabled]="resetLoading" class="btn-primary">
            <span *ngIf="!resetLoading">Save Password</span>
            <span *ngIf="resetLoading"><i class="fa-solid fa-circle-notch fa-spin mr-1.5" aria-hidden="true"></i>Updating...</span>
        </button>
    </app-modal-shell>
</div>
