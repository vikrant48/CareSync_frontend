<div
    class="min-h-[calc(100dvh-3.5rem)] lg:h-[calc(100dvh-3.5rem)] w-full bg-white dark:bg-gray-950 grid lg:grid-cols-2 lg:overflow-hidden transition-all duration-500">

    <!-- Left Side: Auto-Rotating Feature Carousel (Hidden on Mobile) -->
    <div class="hidden lg:block h-full">
        <app-feature-carousel></app-feature-carousel>
    </div>

    <!-- Right Side: Interaction Panel -->
    <div
        class="relative flex flex-col justify-start sm:justify-center min-h-[calc(100dvh-3.5rem)] lg:h-[calc(100dvh-3.5rem)] py-5 sm:py-6 px-4 sm:px-6 lg:px-10 max-w-[46rem] mx-auto w-full bg-white dark:bg-gray-950 overflow-y-auto lg:overflow-hidden custom-scrollbar">

        <div class="w-full pb-8 sm:pb-2">

            <!-- Page Header -->
            <div class="mb-4 sm:mb-3">
                <h2
                    class="text-2xl sm:text-xl font-black text-gray-900 dark:text-white tracking-tight mb-1 leading-tight">
                    Create Account</h2>
                <p class="text-sm sm:text-[11px] text-gray-500 dark:text-gray-400 font-medium">Join our healthcare
                    network</p>
            </div>

            <!-- Quick Google Sign-Up Option -->
            <div
                class="mb-5 sm:mb-3 p-3 sm:p-2 bg-emerald-50/50 dark:bg-emerald-950/20 border border-emerald-200/60 dark:border-emerald-800/40 rounded-xl flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 sm:gap-2">
                <div class="flex items-center justify-between sm:justify-start gap-2">
                    <span class="text-xs sm:text-[11px] font-bold text-gray-700 dark:text-gray-300 shrink-0">Sign up
                        as:</span>
                    <div
                        class="flex items-center justify-center p-0.5 bg-white dark:bg-gray-800 rounded-lg shadow-xs border border-gray-200 dark:border-gray-700">
                        <button type="button" (click)="googleRole = 'PATIENT'"
                            [class]="googleRole === 'PATIENT' ? 'bg-emerald-500 text-white shadow-xs font-bold' : 'text-gray-500 dark:text-gray-400 font-medium'"
                            class="px-3 sm:px-2 py-1.5 sm:py-0.5 text-xs sm:text-[10px] rounded-md transition-all cursor-pointer min-h-touch sm:min-h-0 inline-flex items-center">
                            Patient
                        </button>
                        <button type="button" (click)="googleRole = 'DOCTOR'"
                            [class]="googleRole === 'DOCTOR' ? 'bg-emerald-500 text-white shadow-xs font-bold' : 'text-gray-500 dark:text-gray-400 font-medium'"
                            class="px-3 sm:px-2 py-1.5 sm:py-0.5 text-xs sm:text-[10px] rounded-md transition-all cursor-pointer min-h-touch sm:min-h-0 inline-flex items-center">
                            Doctor
                        </button>
                    </div>
                </div>

                <button type="button" (click)="onGoogleSignUp()" [disabled]="loading"
                    class="flex items-center justify-center gap-2 py-2.5 sm:py-1 px-3 border border-gray-300 dark:border-gray-600 rounded-xl sm:rounded-lg shadow-xs text-xs font-semibold text-gray-700 dark:text-gray-200 bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700 transition-all cursor-pointer w-full sm:w-auto min-h-touch sm:min-h-0">
                    <svg class="w-4 h-4 sm:w-3.5 sm:h-3.5 shrink-0" viewBox="0 0 24 24">
                        <path fill="#4285F4"
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                        <path fill="#34A853"
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                        <path fill="#FBBC05"
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
                        <path fill="#EA4335"
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
                    </svg>
                    <span>Sign Up with Google</span>
                </button>
            </div>

            <!-- Progress Indicator -->
            <div class="relative flex items-center justify-between mb-8 sm:mb-5 px-1 sm:px-4">
                <div
                    class="absolute left-4 right-4 top-1/2 -translate-y-1/2 h-[1.5px] bg-gray-100 dark:bg-gray-800 z-0">
                </div>
                <div class="absolute left-4 top-1/2 -translate-y-1/2 h-[2px] bg-emerald-500 transition-all duration-700 ease-[cubic-bezier(0.34,1.56,0.64,1)] shadow-[0_0_12px_rgba(16,185,129,0.5)] z-0"
                    [style.width.%]="(currentStep - 1) * 31"></div>

                <ng-container *ngFor="let step of [1, 2, 3, 4]; let i = index">
                    <div class="relative z-10 flex flex-col items-center group"
                        [class.cursor-pointer]="i + 1 < currentStep"
                        (click)="i + 1 < currentStep ? navigateToStep(i + 1) : null">
                        <div class="w-9 h-9 sm:w-8 sm:h-8 rounded-lg flex items-center justify-center text-xs sm:text-[10px] font-black transition-all duration-500 ring-[3px] ring-white dark:ring-gray-950"
                            [ngClass]="getStepClasses(step)">
                            <i class="fa-solid fa-check text-[10px] sm:text-[8px]" *ngIf="step < currentStep"></i>
                            <span *ngIf="step >= currentStep">{{ step }}</span>
                        </div>
                        <div class="absolute top-full mt-1.5 left-1/2 -translate-x-1/2 whitespace-nowrap text-[9px] sm:text-[8px] uppercase tracking-wider font-extrabold transition-all duration-300"
                            [ngClass]="{
                   'text-emerald-600 dark:text-emerald-400 opacity-100': step === currentStep,
                   'text-emerald-600/80 dark:text-emerald-400/80 opacity-100': step < currentStep,
                   'text-gray-400 dark:text-gray-400 opacity-100': step > currentStep
                 }">
                            {{ getStepLabel(step) }}
                        </div>
                    </div>
                </ng-container>
            </div>

            <!-- Form Content -->
            <div class="pt-1">

                <!-- Step 1: Personal -->
                <section *ngIf="currentStep === 1" [formGroup]="basicForm"
                    class="space-y-3.5 sm:space-y-2.5 animate-in fade-in slide-in-from-right-4 duration-500">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 sm:gap-2.5">
                        <div class="space-y-1">
                            <label
                                class="block text-[10px] sm:text-[9px] font-black uppercase tracking-wider text-gray-400 dark:text-gray-500">First
                                Name</label>
                            <input
                                class="input-modern min-h-touch sm:h-[34px] sm:min-h-0 py-2.5 sm:py-0 text-sm sm:text-xs px-3"
                                formControlName="firstName" placeholder="John" />
                        </div>
                        <div class="space-y-1">
                            <label
                                class="block text-[10px] sm:text-[9px] font-black uppercase tracking-wider text-gray-400 dark:text-gray-500">Last
                                Name</label>
                            <input
                                class="input-modern min-h-touch sm:h-[34px] sm:min-h-0 py-2.5 sm:py-0 text-sm sm:text-xs px-3"
                                formControlName="lastName" placeholder="Doe" />
                        </div>
                        <div class="space-y-1">
                            <label
                                class="block text-[10px] sm:text-[9px] font-black uppercase tracking-wider text-gray-400 dark:text-gray-500">Email
                                Address</label>
                            <input
                                class="input-modern min-h-touch sm:h-[34px] sm:min-h-0 py-2.5 sm:py-0 text-sm sm:text-xs px-3"
                                type="email" formControlName="email" placeholder="john.doe@medical.id" />
                        </div>
                        <div class="space-y-1">
                            <label
                                class="block text-[10px] sm:text-[9px] font-black uppercase tracking-wider text-gray-400 dark:text-gray-500">Mobile
                                Number</label>
                            <input
                                class="input-modern min-h-touch sm:h-[34px] sm:min-h-0 py-2.5 sm:py-0 text-sm sm:text-xs px-3"
                                formControlName="contactInfo" (input)="onPhoneInput($event)"
                                placeholder="+91 9876543210" />
                        </div>
                        <app-date-picker formControlName="dateOfBirth" label="Birth Date" placeholder="DD-MM-YYYY"
                            class="relative z-20">
                        </app-date-picker>
                        <app-select-dropdown label="Gender" [options]="genders" placeholder="Select gender"
                            formControlName="gender" class="relative z-30"
                            customButtonClass="w-full min-h-touch sm:h-[34px] sm:min-h-0 py-2.5 sm:py-0 text-sm sm:text-xs px-3 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 cursor-pointer relative transition-all duration-200 group flex items-center justify-between text-left font-medium text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 hover:border-gray-300 dark:hover:border-gray-600"
                            customLabelClass="block text-[10px] sm:text-[9px] font-black uppercase tracking-wider text-gray-400 dark:text-gray-500 mb-1">
                        </app-select-dropdown>
                        <div class="space-y-1 relative z-10">
                            <label
                                class="block text-[10px] sm:text-[9px] font-black uppercase tracking-wider text-gray-400 dark:text-gray-500">Username</label>
                            <input
                                class="input-modern min-h-touch sm:h-[34px] sm:min-h-0 py-2.5 sm:py-0 text-sm sm:text-xs px-3"
                                formControlName="username" placeholder="johndoe_md" />
                        </div>
                        <div class="space-y-1 relative z-10">
                            <label
                                class="block text-[10px] sm:text-[9px] font-black uppercase tracking-wider text-gray-400 dark:text-gray-500">Password</label>
                            <div class="relative group">
                                <input
                                    class="input-modern pr-10 sm:pr-8 min-h-touch sm:h-[34px] sm:min-h-0 py-2.5 sm:py-0 text-sm sm:text-xs px-3"
                                    [type]="showPassword ? 'text' : 'password'" formControlName="password"
                                    placeholder="••••••••" />
                                <button type="button"
                                    class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-300 hover:text-emerald-500 transition-colors min-w-touch min-h-touch inline-flex items-center justify-center"
                                    (click)="togglePassword()"
                                    [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
                                    <i
                                        [class]="showPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye' + ' text-sm sm:text-xs'"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Step 2: Verification -->
                <section *ngIf="currentStep === 2" [formGroup]="verificationForm"
                    class="space-y-4 sm:space-y-3 animate-in fade-in slide-in-from-right-4 duration-500 text-center py-4 sm:py-2">
                    <div
                        class="w-14 h-14 sm:w-12 sm:h-12 bg-emerald-100 dark:bg-emerald-900/30 rounded-xl mx-auto flex items-center justify-center mb-2 ring-4 ring-emerald-500/5">
                        <i class="fa-solid fa-paper-plane text-xl sm:text-lg text-emerald-500 animate-bounce"></i>
                    </div>
                    <div>
                        <h3 class="text-lg sm:text-base font-black text-gray-900 dark:text-white mb-1">Check inbox</h3>
                        <p class="text-xs sm:text-[10px] text-gray-500 dark:text-gray-400 font-medium italic">Sent code
                            to verify your identity.</p>
                    </div>

                    <div class="max-w-xs mx-auto space-y-3 sm:space-y-2.5">
                        <div class="space-y-2">
                            <input
                                class="w-full bg-gray-50 dark:bg-gray-900 border-2 border-gray-100 dark:border-gray-800 rounded-xl px-3 py-3 sm:py-1.5 text-center text-xl sm:text-lg font-black tracking-[0.3em] focus:border-emerald-500 outline-none min-h-touch"
                                formControlName="otp" placeholder="000000" maxlength="6" />
                            <button type="button" (click)="sendVerificationCode()"
                                class="text-[10px] sm:text-[8px] font-black uppercase tracking-widest text-emerald-600 hover:text-emerald-500 min-h-touch px-2"
                                [disabled]="loading">
                                Resend Code
                            </button>
                        </div>
                        <button type="button" (click)="verifyEmail()" [disabled]="loading"
                            class="btn-modern-primary w-full py-3 sm:py-2 text-sm sm:text-xs font-bold min-h-touch">
                            <span *ngIf="!loading">Verify & Proceed</span>
                            <span *ngIf="loading"><i class="fa-solid fa-circle-notch fa-spin"></i></span>
                        </button>
                        <div class="pt-1">
                            <button type="button" (click)="skipVerification()"
                                class="w-full text-xs sm:text-[10px] font-bold text-amber-600 dark:text-amber-400 hover:text-amber-700 dark:hover:text-amber-300 underline underline-offset-2 flex items-center justify-center gap-1.5 transition-colors min-h-touch">
                                <i class="fa-solid fa-forward text-[10px]"></i> Skip Email Verification
                            </button>
                        </div>
                    </div>
                </section>

                <!-- Step 3: Role Selection -->
                <section *ngIf="currentStep === 3" [formGroup]="roleForm"
                    class="space-y-3 animate-in fade-in slide-in-from-right-4 duration-500">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-2.5">
                        <label class="relative group cursor-pointer">
                            <input type="radio" class="sr-only peer" formControlName="role" value="DOCTOR" />
                            <div
                                class="h-full p-4 rounded-xl border-2 border-gray-100 dark:border-gray-800 bg-white dark:bg-gray-900 transition-all duration-300 peer-checked:border-emerald-500 peer-checked:bg-emerald-50/20 dark:peer-checked:bg-emerald-950/20 peer-checked:ring-2 peer-checked:ring-emerald-500/10">
                                <div
                                    class="w-10 h-10 sm:w-8 sm:h-8 bg-emerald-100 dark:bg-emerald-900/40 rounded-lg flex items-center justify-center text-emerald-600 dark:text-emerald-400 mb-2.5 sm:mb-2 group-hover:scale-110 transition-transform">
                                    <i class="fa-solid fa-user-doctor text-base"></i>
                                </div>
                                <h4
                                    class="text-base sm:text-sm font-black text-gray-900 dark:text-white mb-1 sm:mb-0.5">
                                    Doctor</h4>
                                <p class="text-xs sm:text-[10px] text-gray-500 dark:text-gray-400 leading-snug">Manage
                                    clinical workflows and prescriptions.</p>
                            </div>
                        </label>

                        <label class="relative group cursor-pointer">
                            <input type="radio" class="sr-only peer" formControlName="role" value="PATIENT" />
                            <div
                                class="h-full p-4 rounded-xl border-2 border-gray-100 dark:border-gray-800 bg-white dark:bg-gray-900 transition-all duration-300 peer-checked:border-emerald-500 peer-checked:bg-emerald-50/20 dark:peer-checked:bg-emerald-950/20 peer-checked:ring-2 peer-checked:ring-emerald-500/10">
                                <div
                                    class="w-10 h-10 sm:w-8 sm:h-8 bg-emerald-100 dark:bg-emerald-900/40 rounded-xl flex items-center justify-center text-emerald-600 dark:text-emerald-400 mb-2.5 sm:mb-2 group-hover:scale-110 transition-transform">
                                    <i class="fa-solid fa-user text-base"></i>
                                </div>
                                <h4
                                    class="text-base sm:text-sm font-black text-gray-900 dark:text-white mb-1 sm:mb-0.5">
                                    Patient</h4>
                                <p class="text-xs sm:text-[10px] text-gray-500 dark:text-gray-400 leading-snug">Book
                                    appointments and track active medical journey.</p>
                            </div>
                        </label>
                    </div>
                </section>

                <!-- Step 4: Final Details -->
                <section *ngIf="currentStep === 4"
                    class="space-y-4 sm:space-y-3 animate-in fade-in slide-in-from-right-4 duration-500">
                    <div>
                        <h3 class="text-lg sm:text-base font-black text-gray-900 dark:text-white mb-1">Specifications
                        </h3>
                        <p class="text-xs sm:text-[10px] text-gray-500 dark:text-gray-400 italic">Help us personalize
                            your active experience.</p>
                    </div>

                    <!-- Doctor fields -->
                    <div *ngIf="roleForm.value.role === 'DOCTOR'" [formGroup]="doctorForm"
                        class="grid grid-cols-1 gap-3.5 sm:gap-2.5">
                        <app-select-dropdown label="Specialization" [options]="specializations"
                            placeholder="Select specialization" [autoCapitalize]="false"
                            formControlName="specialization"
                            customButtonClass="w-full min-h-touch sm:h-[34px] sm:min-h-0 py-2.5 sm:py-0 text-sm sm:text-xs px-3 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 cursor-pointer relative transition-all duration-200 group flex items-center justify-between text-left font-medium text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 hover:border-gray-300 dark:hover:border-gray-600"
                            customLabelClass="block text-[10px] sm:text-[9px] font-black uppercase tracking-wider text-gray-400 dark:text-gray-500 mb-1">
                        </app-select-dropdown>
                        <div class="space-y-1">
                            <label
                                class="block text-[10px] sm:text-[9px] font-black uppercase tracking-wider text-gray-400 dark:text-gray-500">Experience
                                (Years)</label>
                            <div class="flex items-center gap-2 sm:gap-1.5">
                                <button type="button" (click)="decrementExperience()"
                                    class="w-11 h-11 sm:w-8 sm:h-8 rounded-lg border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-gray-400 hover:border-emerald-500 hover:text-emerald-500 transition-all flex items-center justify-center active:scale-90 shrink-0">
                                    <i class="fa-solid fa-minus text-xs sm:text-[10px]"></i>
                                </button>

                                <div class="relative flex-1">
                                    <input
                                        class="input-modern py-2.5 sm:py-1.5 text-sm sm:text-xs pl-3 pr-10 sm:pr-8 text-center font-black min-h-touch sm:min-h-0 [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none"
                                        type="number" formControlName="experience" placeholder="0" />
                                    <span
                                        class="absolute right-3 sm:right-2.5 top-1/2 -translate-y-1/2 text-[10px] sm:text-[8px] font-black uppercase text-gray-400 tracking-tighter pointer-events-none">Yrs</span>
                                </div>

                                <button type="button" (click)="incrementExperience()"
                                    class="w-11 h-11 sm:w-8 sm:h-8 rounded-lg border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-gray-400 hover:border-emerald-500 hover:text-emerald-500 transition-all flex items-center justify-center active:scale-90 shrink-0">
                                    <i class="fa-solid fa-plus text-xs sm:text-[10px]"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Patient fields -->
                    <div *ngIf="roleForm.value.role === 'PATIENT'" [formGroup]="patientForm"
                        class="grid grid-cols-1 gap-3 sm:gap-2.5">
                        <div class="space-y-2">
                            <label
                                class="block text-[10px] sm:text-[9px] font-black uppercase tracking-wider text-gray-400 dark:text-gray-500">Blood
                                Group</label>
                            <div class="grid grid-cols-4 gap-2 sm:gap-1.5">
                                <label *ngFor="let bg of ['A+', 'A-', 'B+', 'B-', 'O+', 'O-', 'AB+', 'AB-']"
                                    class="relative group cursor-pointer">
                                    <input type="radio" class="sr-only peer" formControlName="bloodGroup"
                                        [value]="bg" />
                                    <div
                                        class="py-2.5 sm:py-1.5 text-center rounded-lg border-2 border-gray-100 dark:border-gray-800 font-black text-sm sm:text-xs peer-checked:border-emerald-500 peer-checked:bg-emerald-500 peer-checked:text-white transition-all min-h-touch sm:min-h-0 flex items-center justify-center">
                                        {{bg}}
                                    </div>
                                </label>
                            </div>
                        </div>
                    </div>
                </section>
            </div>

            <!-- Bottom Navigation -->
            <div class="mt-6 sm:mt-3 flex items-center justify-between gap-3 transition-all">
                <button *ngIf="currentStep > 1" type="button" (click)="prev()"
                    class="group px-3 py-2.5 sm:py-1.5 text-xs sm:text-[9px] font-black uppercase tracking-wider text-gray-400 dark:text-gray-500 hover:text-gray-900 dark:hover:text-white transition-colors flex items-center gap-1.5 min-h-touch sm:min-h-0">
                    <i class="fa-solid fa-arrow-left transition-transform group-hover:-translate-x-1"></i> Back
                </button>
                <div class="flex-1"></div>

                <button *ngIf="currentStep === 1 || currentStep === 3" type="button" (click)="next()"
                    [disabled]="loading"
                    class="btn-modern-primary px-6 sm:px-5 py-3 sm:py-2 text-sm sm:text-xs min-w-[120px] sm:min-w-[100px] font-semibold min-h-touch sm:min-h-0">
                    <span *ngIf="!loading" class="flex items-center gap-1.5">Continue <i
                            class="fa-solid fa-arrow-right text-[10px] sm:text-[9px]"></i></span>
                    <span *ngIf="loading"><i class="fa-solid fa-circle-notch fa-spin"></i></span>
                </button>

                <button *ngIf="currentStep === 4" type="button" (click)="complete()" [disabled]="loading"
                    class="btn-modern-primary px-6 sm:px-5 py-3 sm:py-2 text-sm sm:text-xs bg-emerald-500 hover:bg-emerald-600 border-none min-w-[130px] sm:min-w-[120px] shadow-md shadow-emerald-500/20 font-semibold min-h-touch sm:min-h-0">
                    <span *ngIf="!loading" class="flex items-center gap-1.5">Finish <i
                            class="fa-solid fa-check text-[10px] sm:text-[9px]"></i></span>
                    <span *ngIf="loading"><i class="fa-solid fa-circle-notch fa-spin"></i></span>
                </button>
            </div>

            <!-- Footer -->
            <div class="mt-5 sm:mt-1.5 text-center">
                <p class="text-xs sm:text-[10px] font-medium text-gray-500 dark:text-gray-400 sm:italic">
                    Existing Participant?
                    <a routerLink="/login"
                        class="text-emerald-600 font-black hover:text-emerald-500 transition-colors ml-1 uppercase underline underline-offset-2">Sign
                        In</a>
                </p>
            </div>
        </div>
    </div>
    <app-toast-container></app-toast-container>
</div>
