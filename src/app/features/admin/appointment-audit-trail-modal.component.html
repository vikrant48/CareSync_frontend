<app-modal-shell [open]="isOpen" title="Appointment Audit Trail"
    [subtitle]="'Appointment #' + appointmentId" titleId="audit-trail-title"
    icon="fa-solid fa-clock-rotate-left" iconWrapClass="bg-cyan-500/20 text-cyan-700 dark:text-cyan-400"
    maxWidthClass="max-w-3xl" bodyClass="p-4 sm:p-6" [hasFooter]="true"
    footerClass="p-4 flex justify-end" (close)="closeModal()">
    <app-page-loader *ngIf="loading" label="Loading status history..." [compact]="true"></app-page-loader>

    <div *ngIf="!loading && logs.length === 0" class="py-12 text-center text-xs text-muted">
        <i class="fa-regular fa-folder-open text-2xl mb-2 block" aria-hidden="true"></i>
        <span>No status transitions recorded for this appointment.</span>
    </div>

    <div *ngIf="!loading && logs.length > 0" class="space-y-3">
        <div *ngFor="let log of logs; trackBy: trackLog"
            class="bg-[var(--bg)] border border-[var(--border)] rounded-xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div
                    class="w-8 h-8 rounded-lg bg-[var(--panel)] border border-[var(--border)] text-[var(--text)] flex items-center justify-center text-xs font-mono font-bold shrink-0">
                    #{{ log.id }}
                </div>
                <div>
                    <div class="flex items-center gap-2 text-xs font-semibold">
                        <span class="text-muted">{{ log.previousStatus }}</span>
                        <i class="fa-solid fa-arrow-right text-[10px] text-cyan-700 dark:text-cyan-400" aria-hidden="true"></i>
                        <span class="text-cyan-700 dark:text-cyan-400 font-bold">{{ log.newStatus }}</span>
                    </div>
                    <p *ngIf="log.reason" class="text-[11px] text-muted mt-0.5 italic">
                        "{{ log.reason }}"
                    </p>
                </div>
            </div>
            <div class="text-right text-[11px] shrink-0 border-t sm:border-t-0 pt-2 sm:pt-0 border-[var(--border)]">
                <span class="text-[var(--text)] font-medium block flex items-center sm:justify-end gap-1">
                    <i class="fa-solid fa-user-gear text-muted text-[10px]" aria-hidden="true"></i> {{ log.changedBy }}
                </span>
                <span class="text-muted font-mono text-[10px]">
                    {{ log.createdAt | date:'medium' }}
                </span>
            </div>
        </div>
    </div>
    <button modalFooter type="button" (click)="closeModal()" class="btn-secondary">Close Audit Trail</button>
</app-modal-shell>
