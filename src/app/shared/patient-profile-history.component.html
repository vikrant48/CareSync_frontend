<app-empty-state
  *ngIf="sortedHistory.length === 0"
  icon="fa-solid fa-folder-open"
  message="No medical history records found."
></app-empty-state>

<div class="grid gap-4" *ngIf="sortedHistory.length > 0">
  <div *ngFor="let m of sortedHistory; trackBy: trackHistory" class="bg-[var(--panel)] border border-[var(--border)] rounded-xl p-5 hover:border-[var(--primary)]/50 transition-colors shadow-sm">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-[var(--primary)]/10 border border-[var(--primary)]/20 flex items-center justify-center text-[var(--primary)]">
          <i class="fa-solid fa-stethoscope" aria-hidden="true"></i>
        </div>
        <div>
          <div class="font-bold text-[var(--text)] text-sm">Visit Date: {{ m.visitDate | date:'mediumDate' }}</div>
          <div class="text-xs text-[var(--muted)]">Record ID: #{{ m.id }}</div>
        </div>
      </div>
    </div>
    <div class="grid md:grid-cols-2 gap-6 text-xs sm:text-sm">
      <div class="space-y-3">
        <div><span class="block text-[10px] font-bold uppercase text-[var(--muted)] mb-1">Diagnosis</span> <span class="text-[var(--text)] font-medium">{{ m.diagnosis || '—' }}</span></div>
        <div><span class="block text-[10px] font-bold uppercase text-[var(--muted)] mb-1">Symptoms</span> <span class="text-slate-600 dark:text-slate-300">{{ m.symptoms || '—' }}</span></div>
        <div><span class="block text-[10px] font-bold uppercase text-[var(--muted)] mb-1">Treatment</span> <span class="text-slate-600 dark:text-slate-300">{{ m.treatment || '—' }}</span></div>
      </div>
      <div class="space-y-3">
        <div><span class="block text-[10px] font-bold uppercase text-[var(--muted)] mb-1">Medicine</span> <span class="text-emerald-700 dark:text-emerald-400 font-mono whitespace-pre-line">{{ m.medicine || '—' }}</span></div>
        <div><span class="block text-[10px] font-bold uppercase text-[var(--muted)] mb-1">Doses</span> <span class="text-slate-600 dark:text-slate-300 whitespace-pre-line">{{ m.doses || '—' }}</span></div>
        <div><span class="block text-[10px] font-bold uppercase text-[var(--muted)] mb-1">Notes</span> <span class="text-[var(--muted)] italic">{{ m.notes || '—' }}</span></div>
      </div>
    </div>
  </div>
</div>
