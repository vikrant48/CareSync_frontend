<div class="ui-panel-hover p-4 sm:p-5 group animate-slide-up h-full flex flex-col"
    [class.opacity-60]="appointment.isActive === false">
    <div class="flex flex-col gap-4 flex-1">
        <!-- Header -->
        <div class="flex items-start justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
                <div
                    class="w-12 h-12 rounded-full bg-brand-soft text-brand flex items-center justify-center font-bold text-lg ring-2 ring-gray-200 dark:ring-gray-700/50 group-hover:ring-brand/40 transition-all overflow-hidden relative shrink-0">
                    <img *ngIf="appointment.doctorProfileImageUrl" [src]="appointment.doctorProfileImageUrl"
                        class="w-full h-full object-cover" alt="Doctor Profile">
                    <span *ngIf="!appointment.doctorProfileImageUrl">{{ (appointment.doctorName || 'D') | slice:0:1
                        }}</span>
                </div>
                <div class="min-w-0">
                    <h4 class="font-bold text-gray-800 dark:text-gray-100 truncate text-base leading-tight">
                        {{ appointment.doctorName }}
                        <span *ngIf="appointment.doctorIsVerified"
                            class="inline-flex items-center gap-1 ml-1 px-1.5 py-0.5 rounded-full bg-brand-soft border border-brand/30 text-[9px] font-black text-brand uppercase tracking-tighter"
                            title="Verified">
                            <i class="fa-solid fa-circle-check"></i>
                            <span>Verified</span>
                        </span>
                    </h4>
                    <p class="text-sm text-gray-600 dark:text-gray-400 truncate">{{ appointment.doctorSpecialization }}
                    </p>
                </div>
            </div>
            <div class="flex items-center gap-2 shrink-0">
                <button type="button" (click)="onDownloadReceipt()"
                    class="p-2.5 min-w-touch min-h-touch text-gray-500 hover:text-brand hover:bg-brand-soft rounded-lg transition-colors inline-flex items-center justify-center"
                    title="Download Receipt" aria-label="Download Receipt">
                    <i class="fa-solid fa-download"></i>
                </button>
                <app-status-badge [status]="appointment.status" [text]="statusLabel(appointment)"></app-status-badge>
            </div>
        </div>

        <!-- Details -->
        <div
            class="bg-gray-50 dark:bg-gray-900/50 rounded-lg p-3 space-y-2 border border-gray-200 dark:border-gray-800/50 flex-1">
            <div class="flex items-center gap-2 text-sm text-gray-700 dark:text-gray-300">
                <i class="fa-solid fa-calendar text-brand w-4"></i>
                <span>{{ appointment.appointmentDate | date:'mediumDate' }}</span>
            </div>
            <div class="flex items-center gap-2 text-sm text-gray-700 dark:text-gray-300">
                <i class="fa-solid fa-clock text-brand w-4"></i>
                <span>{{ appointment.appointmentTime }}</span>
            </div>
            <div class="flex items-start gap-2 text-sm text-gray-700 dark:text-gray-300" *ngIf="appointment.reason">
                <i class="fa-solid fa-note-sticky text-gray-500 w-4 mt-0.5"></i>
                <span class="italic text-gray-500 dark:text-gray-400 text-xs">{{ appointment.reason }}</span>
            </div>
        </div>

        <!-- Actions (patient-specific) -->
        <div class="flex flex-wrap gap-2 pt-3 border-t border-gray-200 dark:border-gray-800 mt-auto">
            <div class="flex flex-col gap-2 w-full" *ngIf="canJoinVideo(appointment)">
                <button
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl shadow-lg shadow-indigo-500/25 text-sm transition-all active:scale-95 flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed"
                    (click)="onJoinVideo()" [disabled]="disabled || appointment.isActive === false">
                    <i class="fa-solid fa-video animate-pulse"></i> Join Video
                </button>
            </div>

            <button *ngIf="appointment.status === 'IN_PROGRESS'" class="btn-secondary w-full text-sm"
                (click)="toggleChat()" [disabled]="disabled || appointment.isActive === false">
                <i class="fa-solid fa-comments"></i> Chat with Doctor
            </button>

            <button *ngIf="appointment.status === 'COMPLETED'" class="btn-primary w-full text-xs"
                (click)="onDownloadPrescription()" [disabled]="disabled">
                <i class="fa-solid fa-file-pdf text-sm"></i> Download Prescription
            </button>

            <button class="btn-secondary flex-1 text-sm py-2" (click)="onViewDoctor()" [disabled]="disabled">
                Profile
            </button>
            <ng-container *ngIf="canPatientReschedule(appointment)">
                <button class="btn-secondary flex-1 text-sm py-2" (click)="onReschedule()"
                    [disabled]="disabled || appointment.isActive === false">Reschedule</button>
                <button type="button" class="btn-danger !px-3" (click)="onCancel()"
                    [disabled]="!canPatientCancel(appointment) || disabled || appointment.isActive === false"
                    title="Cancel" aria-label="Cancel appointment">
                    <i class="fa-solid fa-ban"></i>
                </button>
            </ng-container>
        </div>
    </div>
</div>
