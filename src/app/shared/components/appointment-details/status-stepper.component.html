<div
    class="bg-[var(--panel)] border border-[var(--border)] rounded-2xl py-3 px-4 sm:py-3.5 sm:px-6 shadow-xl space-y-3">
    <!-- Terminal State Warning Banner (If Cancelled or No Show) -->
    <div *ngIf="isTerminalState" class="p-3 rounded-xl border flex items-center justify-between gap-3 text-xs font-bold"
        [ngClass]="{
          'bg-rose-500/10 border-rose-500/30 text-rose-600 dark:text-rose-400': isCancelled,
          'bg-amber-500/10 border-amber-500/30 text-amber-600 dark:text-amber-400': isNoShow
        }">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-triangle-exclamation text-sm"></i>
            <span>Appointment Terminal State: {{ currentStatusLabel }}</span>
        </div>
        <span class="px-2 py-0.5 rounded bg-[var(--bg)] text-[10px] tracking-wider uppercase">
            {{ currentStatus }}
        </span>
    </div>

    <!-- Stepper Pipeline Track -->
    <div
        class="relative flex items-center justify-between overflow-x-auto pb-1.5 sm:pb-0 scrollbar-thin scrollbar-thumb-gray-300 dark:scrollbar-thumb-gray-800">
        <div *ngFor="let stage of stages; let i = index; let isLast = last"
            class="flex-1 flex items-center min-w-[85px] sm:min-w-0"
            [attr.aria-label]="stage.name + ' - ' + stage.state">

            <!-- Stage Item Node -->
            <div class="flex flex-col items-center gap-1.5 group w-full text-center relative z-10">
                <!-- Circle Node -->
                <div class="w-7 h-7 sm:w-8 sm:h-8 rounded-full flex items-center justify-center font-bold text-xs transition-all duration-300 shadow-md"
                    [ngClass]="{
                'bg-emerald-500 text-gray-950 ring-4 ring-emerald-500/20': stage.state === 'COMPLETED',
                'bg-indigo-600 text-white ring-4 ring-indigo-500/40 animate-pulse': stage.state === 'CURRENT',
                'bg-gray-100 dark:bg-gray-800 text-gray-400 dark:text-gray-500 border border-gray-300 dark:border-gray-700': stage.state === 'UPCOMING',
                'bg-rose-900/40 text-rose-400 border border-rose-700': stage.state === 'CANCELLED'
              }">
                    <i *ngIf="stage.state === 'COMPLETED'" class="fa-solid fa-check text-xs font-black"></i>
                    <span *ngIf="stage.state !== 'COMPLETED'">{{ i + 1 }}</span>
                </div>

                <!-- Stage Title -->
                <span class="text-[10px] sm:text-[11px] font-semibold tracking-tight transition-colors" [ngClass]="{
                'text-emerald-600 dark:text-emerald-400 font-bold': stage.state === 'COMPLETED',
                'text-indigo-600 dark:text-indigo-400 font-bold': stage.state === 'CURRENT',
                'text-[var(--muted)]': stage.state === 'UPCOMING',
                'text-rose-600 dark:text-rose-400': stage.state === 'CANCELLED'
              }">
                    {{ stage.name }}
                </span>
            </div>

            <!-- Connecting Line Connector -->
            <div *ngIf="!isLast" class="h-[1.5px] flex-1 -mx-2 sm:-mx-3 transition-all duration-300" [ngClass]="{
             'bg-emerald-500': stage.state === 'COMPLETED',
             'bg-gradient-to-r from-emerald-500 to-gray-300 dark:to-gray-800': stage.state === 'CURRENT',
             'bg-gray-200 dark:bg-gray-800': stage.state === 'UPCOMING'
           }">
            </div>

        </div>
    </div>
</div>
