<div
    class="bg-[var(--panel)] border border-[var(--border)] rounded-2xl p-5 sm:p-6 shadow-xl flex flex-col md:flex-row items-start md:items-center justify-between gap-6">
    <!-- LEFT: Other Person Details -->
    <div class="flex items-center gap-4 sm:gap-5 min-w-0 flex-1">
        <app-user-avatar [imageUrl]="otherPersonAvatar" [name]="otherPersonName" size="xl"></app-user-avatar>
        <div class="min-w-0 space-y-1">
            <div class="flex items-center gap-2 flex-wrap">
                <h2 class="text-xl sm:text-2xl font-black text-[var(--text)] truncate tracking-tight">
                    {{ otherPersonName }}
                </h2>
                <span *ngIf="viewerRole === 'PATIENT' && appointment?.doctorIsVerified"
                    class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-cyan-500/10 border border-cyan-500/30 text-[10px] font-bold text-cyan-600 dark:text-cyan-400 uppercase tracking-wider">
                    <i class="fa-solid fa-circle-check" aria-hidden="true"></i>
                    <span>Verified</span>
                </span>
            </div>

            <p *ngIf="otherPersonSubtext" class="text-sm font-semibold text-cyan-600 dark:text-cyan-400 truncate">
                {{ otherPersonSubtext }}
            </p>

            <div class="flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-[var(--muted)] pt-0.5">
                <span *ngIf="otherPersonEmail" class="inline-flex items-center gap-1.5">
                    <i class="fa-solid fa-envelope text-[var(--muted)]" aria-hidden="true"></i>
                    <span class="truncate">{{ otherPersonEmail }}</span>
                </span>
                <span *ngIf="otherPersonMobile" class="inline-flex items-center gap-1.5">
                    <i class="fa-solid fa-phone text-[var(--muted)]" aria-hidden="true"></i>
                    <span>{{ otherPersonMobile }}</span>
                </span>
            </div>
        </div>
    </div>

    <!-- RIGHT: Reason for Visit & Status Badge -->
    <div
        class="w-full md:w-auto flex flex-row md:flex-col items-center md:items-end justify-between gap-3 pt-4 md:pt-0 border-t md:border-t-0 border-[var(--border)] shrink-0">
        <div class="text-left md:text-right space-y-1 min-w-0 flex-1 md:flex-none">
            <span class="text-[10px] font-bold uppercase tracking-widest text-[var(--muted)]">Reason for Visit</span>
            <p class="text-sm font-bold text-[var(--text)] line-clamp-2 md:max-w-xs">
                {{ appointment?.reason?.trim() || 'No specific reason provided.' }}
            </p>
        </div>
        <div class="shrink-0">
            <app-status-badge [status]="appointment?.status || ''"></app-status-badge>
        </div>
    </div>
</div>
