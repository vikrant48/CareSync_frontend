<div
    class="bg-gray-900 border border-gray-800 rounded-2xl p-5 sm:p-6 shadow-xl flex flex-col md:flex-row items-start md:items-center justify-between gap-6">
    <!-- LEFT: Other Person Details -->
    <div class="flex items-center gap-4 sm:gap-5 min-w-0 flex-1">
        <app-user-avatar [imageUrl]="otherPersonAvatar" [name]="otherPersonName" size="xl"></app-user-avatar>
        <div class="min-w-0 space-y-1">
            <div class="flex items-center gap-2 flex-wrap">
                <h2 class="text-xl sm:text-2xl font-black text-gray-100 truncate tracking-tight">
                    {{ otherPersonName }}
                </h2>
                <span *ngIf="viewerRole === 'PATIENT' && appointment?.doctorIsVerified"
                    class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-cyan-500/10 border border-cyan-500/30 text-[10px] font-bold text-cyan-400 uppercase tracking-wider">
                    <i class="fa-solid fa-circle-check"></i>
                    <span>Verified</span>
                </span>
            </div>

            <p *ngIf="otherPersonSubtext" class="text-sm font-semibold text-cyan-400 truncate">
                {{ otherPersonSubtext }}
            </p>

            <div class="flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-gray-400 pt-0.5">
                <span *ngIf="otherPersonEmail" class="inline-flex items-center gap-1.5">
                    <i class="fa-solid fa-envelope text-gray-500"></i>
                    <span class="truncate">{{ otherPersonEmail }}</span>
                </span>
                <span *ngIf="otherPersonMobile" class="inline-flex items-center gap-1.5">
                    <i class="fa-solid fa-phone text-gray-500"></i>
                    <span>{{ otherPersonMobile }}</span>
                </span>
            </div>
        </div>
    </div>

    <!-- RIGHT: Reason for Visit & Status Badge -->
    <div
        class="w-full md:w-auto flex flex-col sm:flex-row md:flex-col items-start md:items-end justify-between gap-3 pt-4 md:pt-0 border-t md:border-t-0 border-gray-800/80 shrink-0">
        <div class="text-left md:text-right space-y-1">
            <span class="text-[10px] font-bold uppercase tracking-widest text-gray-500">Reason for Visit</span>
            <p class="text-sm font-bold text-gray-200 line-clamp-2 max-w-xs">
                {{ appointment?.reason || 'Regular checkup & consultation' }}
            </p>
        </div>
        <div class="mt-1">
            <app-status-badge [status]="appointment?.status"></app-status-badge>
        </div>
    </div>
</div>
