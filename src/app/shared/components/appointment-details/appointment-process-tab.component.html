<div class="bg-[var(--panel)] border border-[var(--border)] rounded-2xl shadow-xl overflow-visible animate-fade-in">
    <!-- Table Header -->
    <div
        class="hidden md:grid grid-cols-12 gap-4 px-6 py-4 bg-[var(--bg)]/70 border-b border-[var(--border)] text-[10px] font-bold uppercase tracking-wider text-[var(--muted)] rounded-t-2xl">
        <div class="col-span-1">#</div>
        <div class="col-span-3">Stage</div>
        <div class="col-span-2">Status</div>
        <div class="col-span-4">Description</div>
        <div class="col-span-2 text-right">Action</div>
    </div>

    <!-- Stage Rows List -->
    <div class="divide-y divide-[var(--border)]">
        <div *ngFor="let stage of processStages; let i = index"
            class="p-4 sm:px-6 sm:py-4 transition-colors flex flex-col md:grid md:grid-cols-12 gap-3 md:gap-4 items-start md:items-center"
            [ngClass]="{
           'bg-indigo-500/10 border-l-4 border-l-indigo-500': stage.state === 'CURRENT',
           'bg-[var(--panel)]': stage.state === 'COMPLETED',
           'bg-[var(--bg)]/40 opacity-75': stage.state === 'UPCOMING'
         }">

            <!-- Mobile Top Bar: Number + Stage Name + Badge -->
            <div class="col-span-4 flex items-center gap-3 w-full md:w-auto justify-between md:justify-start">
                <div class="flex items-center gap-3 min-w-0">
                    <div class="w-7 h-7 rounded-full flex items-center justify-center font-bold text-xs shrink-0"
                        [ngClass]="{
                  'bg-emerald-500/20 text-emerald-600 dark:text-emerald-400 border border-emerald-500/30': stage.state === 'COMPLETED',
                  'bg-indigo-600 text-white shadow-lg shadow-indigo-500/30': stage.state === 'CURRENT',
                  'bg-[var(--bg)] text-[var(--muted)] border border-[var(--border)]': stage.state === 'UPCOMING',
                  'bg-rose-500/20 text-rose-600 dark:text-rose-400 border border-rose-500/30': stage.state === 'CANCELLED'
                }">
                        {{ i + 1 }}
                    </div>
                    <span class="font-bold text-sm text-[var(--text)] truncate">{{ stage.name }}</span>
                </div>

                <!-- Mobile Badge -->
                <div class="md:hidden">
                    <span class="px-2.5 py-1 rounded-full text-[10px] font-bold inline-flex items-center gap-1"
                        [ngClass]="{
                  'bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/30': stage.state === 'COMPLETED',
                  'bg-indigo-500/20 text-indigo-600 dark:text-indigo-300 border border-indigo-500/40': stage.state === 'CURRENT',
                  'bg-[var(--bg)] text-[var(--muted)] border border-[var(--border)]': stage.state === 'UPCOMING',
                  'bg-rose-500/10 text-rose-600 dark:text-rose-400 border border-rose-500/30': stage.state === 'CANCELLED'
                }">
                        <i *ngIf="stage.state === 'COMPLETED'" class="fa-solid fa-circle-check"></i>
                        <span>{{ stage.state }}</span>
                    </span>
                </div>
            </div>

            <!-- Stage Status Badge (Desktop) -->
            <div class="hidden md:block col-span-2">
                <span class="px-2.5 py-1 rounded-full text-[10px] font-bold inline-flex items-center gap-1.5" [ngClass]="{
                'bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/30': stage.state === 'COMPLETED',
                'bg-indigo-500/20 text-indigo-600 dark:text-indigo-300 border border-indigo-500/40 animate-pulse': stage.state === 'CURRENT',
                'bg-[var(--bg)] text-[var(--muted)] border border-[var(--border)]': stage.state === 'UPCOMING',
                'bg-rose-500/10 text-rose-600 dark:text-rose-400 border border-rose-500/30': stage.state === 'CANCELLED'
              }">
                    <i *ngIf="stage.state === 'COMPLETED'" class="fa-solid fa-circle-check"></i>
                    <span>{{ stage.state }}</span>
                </span>
            </div>

            <!-- Stage Description -->
            <div class="col-span-4 text-xs text-[var(--muted)]">
                {{ stage.description }}
            </div>

            <!-- Action Button / Dropdown (Desktop & Mobile) -->
            <div class="col-span-2 w-full md:w-auto flex md:justify-end pt-2 md:pt-0 relative">

                <!-- Active Dropdown Menu for Current Stage -->
                <ng-container *ngIf="stage.state === 'CURRENT' && availableActions.length > 0; else lockedAction">
                    <div class="relative w-full md:w-auto">
                        <button type="button" (click)="toggleDropdown(i); $event.stopPropagation()"
                            class="w-full md:w-auto px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs rounded-xl shadow-lg shadow-indigo-600/25 transition-all flex items-center justify-between md:justify-center gap-2">
                            <span>Actions</span>
                            <i class="fa-solid fa-chevron-down text-[10px] transition-transform"
                                [class.rotate-180]="openDropdownIndex === i"></i>
                        </button>

                        <!-- Dropdown Menu Panel (Opens Above Button) -->
                        <div *ngIf="openDropdownIndex === i"
                            class="absolute right-0 bottom-full mb-2 w-full md:w-56 bg-[var(--panel)] border border-[var(--border)] rounded-xl shadow-2xl p-1.5 z-50 space-y-1 animate-scale-up">
                            <button *ngFor="let act of availableActions" type="button"
                                (click)="triggerAction(act.key); openDropdownIndex = null"
                                class="w-full text-left px-3 py-2 text-xs font-semibold text-[var(--text)] hover:bg-indigo-600/15 rounded-lg transition-colors flex items-center gap-2.5">
                                <i [class]="act.icon + ' text-indigo-500 dark:text-indigo-400 w-4 text-center'"></i>
                                <span>{{ act.label }}</span>
                            </button>
                        </div>
                    </div>
                </ng-container>

                <!-- Locked Stage Placeholder -->
                <ng-template #lockedAction>
                    <button type="button" disabled
                        class="w-full md:w-auto px-3.5 py-1.5 bg-[var(--bg)]/60 border border-[var(--border)] text-[var(--muted)] text-xs font-semibold rounded-xl cursor-not-allowed flex items-center justify-center gap-1.5 opacity-60">
                        <i class="fa-solid fa-lock text-[10px]"></i>
                        <span>{{ stage.state === 'COMPLETED' ? 'Completed' : 'Locked' }}</span>
                    </button>
                </ng-template>

            </div>

        </div>
    </div>
</div>
