<div (click)="onViewAppointment()"
    class="bg-[#151b2b] border border-[#2a3347] hover:border-[#3b4763] rounded-2xl p-4 sm:p-5 shadow-xl transition-all duration-200 flex flex-col justify-between h-full cursor-pointer group hover:shadow-2xl">

    <div class="space-y-3.5">
        <!-- Header: Avatar + Person Info + (Receipt Icon & Status Badge) -->
        <div class="flex items-start justify-between gap-2.5">
            <div class="flex items-center gap-3 min-w-0">
                <app-user-avatar [imageUrl]="otherPersonAvatar" [name]="otherPersonName" size="md"></app-user-avatar>
                <div class="min-w-0">
                    <h3
                        class="text-base font-extrabold text-white group-hover:text-[#5b6cf0] transition-colors truncate">
                        {{ otherPersonName }}
                    </h3>
                    <p class="text-xs font-medium text-[#9aa3b8] truncate mt-0.5">
                        {{ otherPersonSubtext }}
                    </p>
                </div>
            </div>

            <!-- Receipt Download Icon & Stage Status Badge on top right -->
            <div class="shrink-0 flex items-center gap-1.5">
                <button *ngIf="viewerRole === 'PATIENT'" type="button" (click)="onDownloadReceipt($event)"
                    class="p-1.5 text-[#9aa3b8] hover:text-[#5b6cf0] hover:bg-[#0b0f1a] border border-transparent hover:border-[#2a3347] rounded-lg transition-all flex items-center justify-center"
                    title="Download Booking Receipt" aria-label="Download Booking Receipt">
                    <i class="fa-solid fa-download text-xs"></i>
                </button>
                <app-status-badge [status]="appointment.status"></app-status-badge>
            </div>
        </div>

        <!-- Date & Time Info in Single Horizontal Row -->
        <div
            class="bg-[#0b0f1a] border border-[#2a3347] rounded-xl px-3 py-2.5 flex items-center justify-between gap-2 text-xs text-[#9aa3b8]">
            <div class="flex items-center gap-2 min-w-0">
                <i class="fa-solid fa-calendar text-[#5b6cf0] text-xs shrink-0"></i>
                <span class="font-medium text-white truncate">{{ appointment.appointmentDate | date:'EEE, dd MMM yyyy'
                    }}</span>
            </div>
            <div class="flex items-center gap-2 shrink-0 border-l border-[#2a3347] pl-3">
                <i class="fa-solid fa-clock text-[#5b6cf0] text-xs shrink-0"></i>
                <span class="font-mono text-white">{{ appointment.appointmentTime }}</span>
            </div>
        </div>
    </div>

    <!-- Action Buttons Row -->
    <div class="pt-3.5 border-t border-[#2a3347] mt-3.5 space-y-2">
        <ng-container *ngIf="appointment.status === 'COMPLETED'; else defaultAction">
            <!-- DOCTOR COMPLETED ACTIONS -->
            <ng-container *ngIf="viewerRole === 'DOCTOR'">
                <button type="button" (click)="onViewMedicalRecord($event)"
                    class="w-full py-2.5 px-4 bg-emerald-600 hover:bg-emerald-500 active:scale-[0.99] text-white text-xs font-bold rounded-xl transition-all shadow-md shadow-emerald-600/20 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-file-medical"></i>
                    <span>View Medical Record</span>
                </button>
            </ng-container>

            <!-- PATIENT COMPLETED ACTIONS -->
            <ng-container *ngIf="viewerRole === 'PATIENT'">
                <div class="grid grid-cols-2 gap-2 w-full">
                    <button type="button" (click)="onViewPrescription($event)"
                        class="py-2 px-3 bg-[#1b2333] hover:bg-[#2a3347] text-emerald-400 border border-emerald-500/30 text-xs font-bold rounded-xl transition-all flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-eye text-xs"></i>
                        <span>View Rx</span>
                    </button>
                    <button type="button" (click)="onDownloadPrescription($event)"
                        class="py-2 px-3 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl transition-all shadow-md shadow-emerald-600/20 flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-file-pdf text-xs"></i>
                        <span>Download Rx</span>
                    </button>
                </div>
                <button *ngIf="!appointment.feedbackSubmitted" type="button" (click)="onGiveFeedback($event)"
                    class="w-full py-2 px-3 bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/30 text-xs font-semibold rounded-xl transition-all flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-star text-amber-400 text-xs"></i>
                    <span>Give Feedback</span>
                </button>
            </ng-container>

            <!-- Secondary button for details -->
            <button type="button" (click)="onViewAppointment(); $event.stopPropagation()"
                class="w-full py-2 px-3 bg-[#1b2333] hover:bg-[#2a3347] text-[#9aa3b8] hover:text-white text-xs font-medium rounded-xl transition-all flex items-center justify-center gap-1.5">
                <span>View Details</span>
                <i class="fa-solid fa-chevron-right text-[10px]"></i>
            </button>
        </ng-container>

        <ng-template #defaultAction>
            <button type="button" (click)="onViewAppointment(); $event.stopPropagation()"
                class="w-full py-2.5 px-4 bg-[#5b6cf0] hover:bg-[#4c5ce0] active:scale-[0.99] text-white text-xs font-bold rounded-xl transition-all shadow-md shadow-[#5b6cf0]/20 flex items-center justify-center gap-1.5">
                <span>View Appointment</span>
                <i class="fa-solid fa-chevron-right text-[10px]"></i>
            </button>
        </ng-template>
    </div>

    <!-- Clinical Visit Completion Preview Modal -->
    <app-visit-completion-preview-modal [isOpen]="showPreviewModal"
        [appointmentId]="appointment?.appointmentId || appointment?.id || 0" [previewData]="previewModalData"
        [isCompleted]="appointment?.status === 'COMPLETED'" (close)="showPreviewModal = false"
        (downloadPdf)="onDownloadPrescription()">
    </app-visit-completion-preview-modal>
</div>
