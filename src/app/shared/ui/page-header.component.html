<div *ngIf="variant === 'hero'; else plainHeader" class="animate-fade-in"
    [ngClass]="'page-hero page-hero--' + size + ' ' + containerClass">
    <div class="relative z-10 flex flex-col sm:flex-row sm:items-center justify-between gap-3 sm:gap-4">
        <ng-container *ngTemplateOutlet="headerBody"></ng-container>
    </div>
</div>

<ng-template #plainHeader>
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 sm:gap-4 animate-fade-in"
        [ngClass]="'mb-4 sm:mb-6 ' + containerClass">
        <ng-container *ngTemplateOutlet="headerBody"></ng-container>
    </div>
</ng-template>

<ng-template #headerBody>
    <div class="min-w-0 flex items-center gap-3">
        <div *ngIf="icon && variant === 'hero'"
            class="w-11 h-11 sm:w-12 sm:h-12 rounded-xl bg-[var(--primary-soft)] text-[var(--primary)] flex items-center justify-center shrink-0">
            <i [class]="icon" aria-hidden="true"></i>
        </div>
        <div class="min-w-0">
            <p *ngIf="eyebrow" class="text-xs font-semibold uppercase tracking-wider text-brand mb-1">
                {{ eyebrow }}
            </p>
            <h1 class="heading font-bold truncate"
                [class.text-xl]="!compact" [class.sm:text-3xl]="!compact" [class.text-lg]="compact"
                [class.sm:text-2xl]="compact">
                {{ title }}
            </h1>
            <p *ngIf="subtitle" class="text-muted text-xs sm:text-sm mt-1">
                {{ subtitle }}
            </p>
        </div>
    </div>
    <div *ngIf="hasActions" class="responsive-action-row w-full sm:w-auto sm:flex-wrap shrink-0">
        <ng-content></ng-content>
    </div>
</ng-template>
