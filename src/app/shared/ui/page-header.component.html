<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 sm:gap-4 mb-4 sm:mb-6 animate-fade-in"
    [ngClass]="containerClass">
    <div class="min-w-0">
        <p *ngIf="eyebrow" class="text-xs font-semibold uppercase tracking-wider text-brand mb-1">
            {{ eyebrow }}
        </p>
        <h1 class="heading font-bold truncate"
            [class.text-xl]="!compact" [class.sm:text-3xl]="!compact" [class.text-lg]="compact"
            [class.sm:text-2xl]="compact">
            {{ title }}
        </h1>
        <p *ngIf="subtitle" class="text-muted text-xs sm:text-sm mt-1">
            {{ subtitle }}
        </p>
    </div>
    <div *ngIf="hasActions" class="responsive-action-row w-full sm:w-auto sm:flex-wrap shrink-0">
        <ng-content></ng-content>
    </div>
</div>
