<!doctype html>
<html lang="en" class="dark theme-dark">

<head>
  <meta charset="utf-8">
  <title>CareSync</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CareSync">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="logo-cross1.png">
  <link rel="apple-touch-icon" href="logo-cross1.png">
  <!-- Display: Outfit · Body: Source Sans 3 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
    rel="stylesheet">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme') || 'dark';
        if (t === 'system') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        var isDark = t !== 'light';
        var d = document.documentElement;
        if (isDark) {
          d.classList.add('dark', 'theme-dark');
          d.classList.remove('light', 'theme-light');
        } else {
          d.classList.add('light', 'theme-light');
          d.classList.remove('dark', 'theme-dark');
        }
      } catch (e) { }
    })();
  </script>
  <script>
    if (typeof global === 'undefined') {
      window.global = window;
    }
  </script>
</head>

<body class="dark:bg-gray-950 dark:text-white">
  <app-root></app-root>
</body>

</html>
