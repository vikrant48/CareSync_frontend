# Every push and pull request: check dependencies for known vulnerabilities, build, run the unit tests, look for
# leaked secrets, and scan the code for security issues. Needs no secrets.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "0 3 * * 1" # weekly scan, also when nothing was pushed

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Only used to generate the build's environment file; CI never calls it
      API_BASE_URL: https://ci.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Known vulnerabilities in app dependencies (high or critical fail the build)
        run: npm audit --omit=dev --audit-level=high
      - name: Production build
        run: npm run build -- --configuration production
      - name: Unit tests
        run: npx ng test --watch=false --browsers=ChromeHeadless

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # whole history: a key removed later is still leaked
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
